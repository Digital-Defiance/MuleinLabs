<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Three separate FHE receipts</title><desc id="d">Correctness, measured noise, and hardness dimensions are separate evidence cards and do not merge into a universal guarantee.</desc><rect width="1920" height="1080" fill="#0a1321"/><g transform="translate(1015 210)" font-family="Arial,sans-serif"><g><rect width="280" height="460" rx="28" fill="#142738" stroke="#22a89c" stroke-width="2"/><circle cx="140" cy="120" r="56" fill="none" stroke="#22a89c" stroke-width="6"/><path d="M108 121l23 23 44-51" fill="none" stroke="#22a89c" stroke-width="8"/><text x="140" y="220" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">CORRECTNESS</text><text x="140" y="265" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">SING parity</text><text x="140" y="315" text-anchor="middle" fill="#9aa8b8" font-size="18">encrypted bit</text><text x="140" y="345" text-anchor="middle" fill="#9aa8b8" font-size="18">equals clear bit</text></g><g transform="translate(315)"><rect width="280" height="460" rx="28" fill="#282235" stroke="#d4833f" stroke-width="2"/><path d="M65 160a85 85 0 0 1 150 0" fill="none" stroke="#66758a" stroke-width="12"/><path d="M140 160l45-58" stroke="#d4833f" stroke-width="7"/><circle cx="140" cy="160" r="10" fill="#d4833f"/><text x="140" y="220" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">NOISE</text><text x="140" y="265" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">measured bound</text><text x="140" y="315" text-anchor="middle" fill="#9aa8b8" font-size="18">named setting</text><text x="140" y="345" text-anchor="middle" fill="#9aa8b8" font-size="18">named bar</text></g><g transform="translate(630)"><rect width="280" height="460" rx="28" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><rect x="75" y="70" width="130" height="110" rx="14" fill="none" stroke="#d4833f" stroke-width="4"/><path d="M98 102h84M98 130h60M98 158h72" stroke="#d4833f" stroke-width="5"/><text x="140" y="220" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">HARDNESS</text><text x="140" y="265" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">exact dimensions</text><text x="140" y="315" text-anchor="middle" fill="#9aa8b8" font-size="18">estimator scope</text><text x="140" y="345" text-anchor="middle" fill="#9aa8b8" font-size="18">caveats retained</text></g><rect x="105" y="515" width="700" height="90" rx="18" fill="#101a2b" stroke="#66758a"/><text x="455" y="553" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">All three are required. None is a universal guarantee.</text><text x="455" y="584" text-anchor="middle" fill="#9aa8b8" font-size="18">Campaign throughput belongs to a different, cleartext clock.</text></g></svg>