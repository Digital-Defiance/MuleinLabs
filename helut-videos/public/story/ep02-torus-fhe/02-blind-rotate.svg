<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Blind rotation</title><desc id="d">An encrypted GGSW control rotates a GLWE accumulator, then branches to a public modulus switch or a separately marked secret experimental refresh.</desc><defs><radialGradient id="b" cx="72%" cy="42%"><stop stop-color="#174552"/><stop offset="1" stop-color="#08111f"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#b)"/><g transform="translate(1020 160)" font-family="Arial,sans-serif"><circle cx="405" cy="270" r="205" fill="#101a2b" stroke="#22a89c" stroke-width="5" stroke-dasharray="10 12"/><circle cx="405" cy="270" r="130" fill="none" stroke="#d4833f" stroke-width="3"/><path d="M405 65a205 205 0 0 1 190 128" fill="none" stroke="#d4833f" stroke-width="11"/><path d="M607 179l-2 37-34-16" fill="#d4833f"/><text x="405" y="257" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">GLWE</text><text x="405" y="294" text-anchor="middle" fill="#9aa8b8" font-size="20">LUT accumulator</text><rect x="20" y="205" width="225" height="130" rx="20" fill="#282235" stroke="#d4833f"/><text x="132" y="248" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">GGSW CONTROL</text><text x="132" y="291" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">rotation hidden</text><path d="M245 270h84" stroke="#d4833f" stroke-width="5"/><path d="M315 420L220 530M500 420l150 110" stroke-width="4" fill="none"/><path d="M315 420L220 530" stroke="#d4833f" stroke-dasharray="8 8"/><path d="M500 420l150 110" stroke="#22a89c"/><rect x="30" y="530" width="390" height="128" rx="22" fill="#2b2025" stroke="#d4833f"/><text x="225" y="574" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">EXPERIMENTAL MODE</text><text x="225" y="614" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">secret refresh ≠ public FHE</text><rect x="550" y="530" width="360" height="128" rx="22" fill="#142738" stroke="#22a89c" stroke-width="2"/><text x="730" y="574" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">PUBLIC PATH</text><text x="730" y="614" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">modulus switch → next wire</text><text x="470" y="726" text-anchor="middle" fill="#9aa8b8" font-size="20">Negacyclic coefficients wrap with a sign change.</text></g></svg>