<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Apple silicon connects host code, Metal shaders, and MPSGraph through one unified memory pool</title>
  <desc id="desc">A flagship right-side architecture diagram shows CPU host code, Metal shaders, and MPSGraph connected by shared buffers in one physical memory pool, contrasted with separately staged CPU RAM and discrete VRAM; synchronization and bandwidth still cost, and no speedup is claimed.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(974 74)" font-family="Arial, sans-serif">
    <text x="450" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">APPLE SILICON · ARCHITECTURAL CASE</text>
    <rect x="0" y="48" width="900" height="602" rx="24" fill="#0c1724" stroke="#22a89c" stroke-width="2"/>
    <text x="30" y="88" fill="#22a89c" font-size="15" letter-spacing="2">ONE PHYSICAL MEMORY POOL</text>
    <text x="870" y="88" text-anchor="end" fill="#9aa8b8" font-size="15">shared-buffer workflow</text>
    <g transform="translate(30 118)">
      <rect x="0" y="62" width="224" height="142" rx="18" fill="#142738" stroke="#66758a" stroke-width="2"/>
      <text x="112" y="99" text-anchor="middle" fill="#9aa8b8" font-size="13" letter-spacing="2">CPU</text>
      <text x="112" y="137" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Host code</text>
      <text x="112" y="166" text-anchor="middle" fill="#9aa8b8" font-size="15">build · update · inspect</text>
      <rect x="616" y="0" width="224" height="142" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="728" y="37" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="2">GPU</text>
      <text x="728" y="75" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Metal shaders</text>
      <text x="728" y="104" text-anchor="middle" fill="#9aa8b8" font-size="15">compute kernels</text>
      <rect x="616" y="228" width="224" height="142" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="728" y="265" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="2">GRAPH</text>
      <text x="728" y="303" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">MPSGraph</text>
      <text x="728" y="332" text-anchor="middle" fill="#9aa8b8" font-size="15">tensor execution</text>
      <rect x="260" y="92" width="320" height="250" rx="28" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <circle cx="420" cy="177" r="62" fill="#091522" stroke="#22a89c" stroke-width="2"/>
      <g fill="#22a89c">
        <rect x="390" y="147" width="22" height="22" rx="4"/><rect x="428" y="147" width="22" height="22" rx="4"/><rect x="390" y="185" width="22" height="22" rx="4"/><rect x="428" y="185" width="22" height="22" rx="4"/>
      </g>
      <text x="420" y="266" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Unified memory</text>
      <text x="420" y="297" text-anchor="middle" fill="#9aa8b8" font-size="15">shared Metal buffers</text>
      <text x="420" y="320" text-anchor="middle" fill="#9aa8b8" font-size="15">one physical pool</text>
      <line x1="224" y1="142" x2="260" y2="177" stroke="#22a89c" stroke-width="4"/>
      <line x1="580" y1="158" x2="616" y2="112" stroke="#22a89c" stroke-width="4"/>
      <line x1="580" y1="280" x2="616" y2="292" stroke="#22a89c" stroke-width="4"/>
      <circle cx="242" cy="160" r="6" fill="#22a89c"/><circle cx="598" cy="135" r="6" fill="#22a89c"/><circle cx="598" cy="286" r="6" fill="#22a89c"/>
      <rect x="0" y="408" width="840" height="76" rx="14" fill="#2b2025" stroke="#d4833f"/>
      <text x="420" y="439" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">SHARED DOES NOT MEAN FREE</text>
      <text x="420" y="468" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">synchronization · cache traffic · bandwidth · allocation still cost</text>
    </g>
    <g transform="translate(0 678)">
      <rect width="900" height="212" rx="22" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="28" y="40" fill="#d4833f" font-size="15" letter-spacing="2">CONTRAST · SEPARATELY STAGED DISCRETE MEMORY</text>
      <g transform="translate(28 64)">
        <rect width="280" height="102" rx="14" fill="#201a22" stroke="#66758a"/>
        <text x="140" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">CPU RAM</text>
        <text x="140" y="72" text-anchor="middle" fill="#9aa8b8" font-size="15">host-side allocation</text>
        <line x1="308" y1="51" x2="504" y2="51" stroke="#d4833f" stroke-width="4"/>
        <polygon points="516,51 498,42 498,60" fill="#d4833f"/>
        <polygon points="320,51 338,42 338,60" fill="#d4833f"/>
        <text x="412" y="35" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="1">EXPLICIT STAGING</text>
        <text x="412" y="76" text-anchor="middle" fill="#9aa8b8" font-size="14">copy / transfer boundary</text>
        <rect x="532" width="312" height="102" rx="14" fill="#201a22" stroke="#66758a"/>
        <text x="688" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">DISCRETE VRAM</text>
        <text x="688" y="72" text-anchor="middle" fill="#9aa8b8" font-size="15">separate GPU pool</text>
      </g>
    </g>
    <text x="450" y="926" text-anchor="middle" fill="#9aa8b8" font-size="16">Architectural enabler · broader shared capacity · no measured speed advantage claimed</text>
  </g>
</svg>
