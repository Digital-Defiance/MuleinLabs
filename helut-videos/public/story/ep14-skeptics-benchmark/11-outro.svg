<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The story moves from circuit execution to melt, freeze, and independent proof</title>
  <desc id="desc">A right-side handoff shows supported execution as the current proved step and melt, freeze, and prove as the next bounded questions, without implying that the optimized-elite proof connection already exists.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(986 170)" font-family="Arial, sans-serif">
    <text x="434" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">IF NOT BETTER SIMULATION, THEN WHAT?</text>
    <rect x="0" y="60" width="868" height="470" rx="24" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(26 132)">
      <rect width="174" height="180" rx="20" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <text x="87" y="42" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="2">CURRENT</text>
      <circle cx="87" cy="91" r="29" fill="#091522" stroke="#22a89c" stroke-width="2"/>
      <text x="87" y="101" text-anchor="middle" fill="#22a89c" font-size="27" font-weight="700">✓</text>
      <text x="87" y="145" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">EXECUTE</text>
      <line x1="174" y1="90" x2="214" y2="90" stroke="#66758a" stroke-width="3"/>
      <polygon points="226,90 209,81 209,99" fill="#66758a"/>
      <rect x="226" width="174" height="180" rx="20" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="313" y="42" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="2">NEXT</text>
      <g transform="translate(270 66)" fill="#d4833f">
        <rect x="0" y="26" width="18" height="40" rx="4"/><rect x="26" y="14" width="18" height="52" rx="4"/><rect x="52" y="2" width="18" height="64" rx="4"/><rect x="78" y="20" width="18" height="46" rx="4"/>
      </g>
      <text x="313" y="145" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">MELT</text>
      <line x1="400" y1="90" x2="440" y2="90" stroke="#66758a" stroke-width="3"/>
      <polygon points="452,90 435,81 435,99" fill="#66758a"/>
      <rect x="452" width="174" height="180" rx="20" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="539" y="42" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="2">NEXT</text>
      <g transform="translate(493 70)" fill="#fff">
        <rect width="24" height="24" rx="3"/><rect x="32" width="24" height="24" rx="3"/><rect x="64" width="24" height="24" rx="3"/>
        <rect y="32" width="24" height="24" rx="3"/><rect x="32" y="32" width="24" height="24" rx="3"/><rect x="64" y="32" width="24" height="24" rx="3"/>
      </g>
      <text x="539" y="145" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">FREEZE</text>
      <line x1="626" y1="90" x2="666" y2="90" stroke="#66758a" stroke-width="3" stroke-dasharray="7 6"/>
      <polygon points="678,90 661,81 661,99" fill="#66758a"/>
      <rect x="678" width="138" height="180" rx="20" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="747" y="42" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="2">GATE</text>
      <path d="M717 73 L747 58 L777 73 V105 C777 126 760 137 747 144 C734 137 717 126 717 105 Z" fill="#091522" stroke="#d4833f" stroke-width="2"/>
      <text x="747" y="105" text-anchor="middle" fill="#d4833f" font-size="27" font-weight="700">?</text>
      <text x="747" y="166" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">PROVE</text>
    </g>
    <g transform="translate(26 348)">
      <rect width="816" height="124" rx="16" fill="#142738"/>
      <text x="408" y="38" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">EPISODE 15</text>
      <text x="408" y="76" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Melt. Freeze. Prove.</text>
      <text x="408" y="105" text-anchor="middle" fill="#9aa8b8" font-size="15">mechanism · controlled pass · missing link · failed experiment</text>
    </g>
  </g>
</svg>
