<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">A native HDL speed comparison has not been established</title>
  <desc id="desc">HELUT has a local observation, while matched Verilator and CXXRTL measurements for the same circuit, stimulus, and checked work are absent; the Swift clear model is labeled as an oracle, not an optimized native baseline.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(982 120)" font-family="Arial, sans-serif">
    <text x="440" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE REDDIT QUESTION · ANSWERED LITERALLY</text>
    <rect x="0" y="58" width="880" height="616" rx="22" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <text x="34" y="105" fill="#fff" font-size="25" font-weight="700">Matched backend comparison</text>
    <text x="846" y="105" text-anchor="end" fill="#9aa8b8" font-size="15">same artifact · stimulus · digest</text>
    <g transform="translate(30 138)">
      <rect width="252" height="272" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="126" y="38" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">PRESENT</text>
      <text x="126" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">HELUT</text>
      <circle cx="126" cy="145" r="39" fill="#091522" stroke="#22a89c" stroke-width="2"/>
      <text x="126" y="155" text-anchor="middle" fill="#22a89c" font-size="29" font-weight="700">✓</text>
      <text x="126" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">local observation</text>
      <text x="126" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">own timing scope</text>
      <rect x="270" width="252" height="272" rx="18" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="396" y="38" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">ABSENT</text>
      <text x="396" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Verilator</text>
      <circle cx="396" cy="145" r="39" fill="#091522" stroke="#d4833f" stroke-width="2"/>
      <text x="396" y="154" text-anchor="middle" fill="#d4833f" font-size="30" font-weight="700">—</text>
      <text x="396" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">no matched result</text>
      <text x="396" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">in current repository</text>
      <rect x="540" width="252" height="272" rx="18" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="666" y="38" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">ABSENT</text>
      <text x="666" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">CXXRTL</text>
      <circle cx="666" cy="145" r="39" fill="#091522" stroke="#d4833f" stroke-width="2"/>
      <text x="666" y="154" text-anchor="middle" fill="#d4833f" font-size="30" font-weight="700">—</text>
      <text x="666" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">no matched result</text>
      <text x="666" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">in current repository</text>
    </g>
    <g transform="translate(30 430)">
      <rect width="792" height="72" rx="13" fill="#142738"/>
      <text x="20" y="29" fill="#9aa8b8" font-size="14" letter-spacing="2">CLEAR SWIFT MODEL</text>
      <text x="772" y="46" text-anchor="end" fill="#fff" font-size="18" font-weight="700">oracle · not an optimized native HDL compiler</text>
      <rect y="90" width="792" height="70" rx="13" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="396" y="119" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">VERDICT</text>
      <text x="396" y="148" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">NATIVE SPEEDUP: NOT ESTABLISHED</text>
    </g>
  </g>
</svg>
