<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The matched paired benchmark leaves HELUT 15.1 percent behind native</title>
  <desc id="desc">On one eight-bit ripple adder at 65,536 lanes, HELUT takes 8.544 milliseconds and sixteen-worker Verilator takes 7.422 milliseconds under the same preparation-through-digest boundary. CXXRTL remains unmeasured.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(982 120)" font-family="Arial, sans-serif">
    <text x="440" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE REDDIT QUESTION · MATCHED PAIRED RESULT</text>
    <rect x="0" y="58" width="880" height="616" rx="22" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <text x="34" y="105" fill="#fff" font-size="25" font-weight="700">B = 65,536 · same ordered digest</text>
    <text x="846" y="105" text-anchor="end" fill="#9aa8b8" font-size="15">one circuit · one host · 5 trials</text>
    <g transform="translate(30 138)">
      <rect width="252" height="272" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="126" y="38" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">HELUT PAIRED</text>
      <text x="126" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">8.544 ms</text>
      <circle cx="126" cy="145" r="39" fill="#091522" stroke="#22a89c" stroke-width="2"/>
      <text x="126" y="155" text-anchor="middle" fill="#22a89c" font-size="23" font-weight="700">1.151×</text>
      <text x="126" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">preparation → digest</text>
      <text x="126" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">strict output readback</text>
      <rect x="270" width="252" height="272" rx="18" fill="#142738" stroke="#7aa2c8" stroke-width="2"/>
      <text x="396" y="38" text-anchor="middle" fill="#7aa2c8" font-size="14" letter-spacing="2">VERILATOR</text>
      <text x="396" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">7.422 ms</text>
      <circle cx="396" cy="145" r="39" fill="#091522" stroke="#7aa2c8" stroke-width="2"/>
      <text x="396" y="154" text-anchor="middle" fill="#7aa2c8" font-size="25" font-weight="700">16</text>
      <text x="396" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">persistent workers</text>
      <text x="396" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">same ordered digest</text>
      <rect x="540" width="252" height="272" rx="18" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="666" y="38" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">STILL OPEN</text>
      <text x="666" y="84" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">CXXRTL</text>
      <circle cx="666" cy="145" r="39" fill="#091522" stroke="#d4833f" stroke-width="2"/>
      <text x="666" y="154" text-anchor="middle" fill="#d4833f" font-size="30" font-weight="700">—</text>
      <text x="666" y="211" text-anchor="middle" fill="#9aa8b8" font-size="15">no matched result</text>
      <text x="666" y="238" text-anchor="middle" fill="#9aa8b8" font-size="15">in this receipt</text>
    </g>
    <g transform="translate(30 430)">
      <rect width="792" height="72" rx="13" fill="#142738"/>
      <text x="20" y="29" fill="#9aa8b8" font-size="14" letter-spacing="2">HISTORICAL GRAPH ROW</text>
      <text x="772" y="46" text-anchor="end" fill="#fff" font-size="18" font-weight="700">asymmetric amortization · not paired throughput</text>
      <rect y="90" width="792" height="70" rx="13" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="396" y="119" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">PAIRED VERDICT</text>
      <text x="396" y="148" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">NATIVE LEADS BY 15.1% · NO CROSSOVER THROUGH 65,536</text>
    </g>
  </g>
</svg>
