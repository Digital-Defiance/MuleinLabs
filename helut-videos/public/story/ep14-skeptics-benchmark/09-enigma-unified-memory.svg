<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">A shared-memory Enigma candidate workflow cycles between CPU orchestration and GPU evaluation</title>
  <desc id="desc">A circular right-side workflow connects CPU candidate construction, shared candidate, state, and score buffers, GPU wide evaluation, and CPU survivor filtering; rotor, ring, plugboard, search, and population state are named, while a near-6-GiB B=1000 warning states capacity is not throughput and no speed advantage is established.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(974 72)" font-family="Arial, sans-serif">
    <text x="450" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">ENIGMA · HYBRID HOST / GPU DESIGN SPACE</text>
    <rect x="0" y="48" width="900" height="740" rx="24" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(36 90)">
      <rect x="0" y="0" width="314" height="190" rx="20" fill="#142738" stroke="#66758a" stroke-width="2"/>
      <text x="24" y="38" fill="#9aa8b8" font-size="14" letter-spacing="2">CPU · BUILD / UPDATE</text>
      <text x="24" y="74" fill="#fff" font-size="24" font-weight="700">Candidate definitions</text>
      <g fill="#9aa8b8" font-size="15">
        <text x="24" y="108">rotor · ring · position</text>
        <text x="24" y="134">plugboard · search · constraints</text>
        <text x="24" y="160">population / schedule state</text>
      </g>
      <line x1="314" y1="95" x2="374" y2="95" stroke="#22a89c" stroke-width="4"/>
      <polygon points="388,95 369,85 369,105" fill="#22a89c"/>
      <rect x="388" y="0" width="440" height="190" rx="24" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <text x="608" y="38" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">ONE UNIFIED MEMORY POOL</text>
      <text x="608" y="76" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Shared working buffers</text>
      <g transform="translate(426 102)">
        <rect width="112" height="50" rx="10" fill="#091522"/><rect x="124" width="112" height="50" rx="10" fill="#091522"/><rect x="248" width="112" height="50" rx="10" fill="#091522"/>
        <text x="56" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">CANDIDATES</text>
        <text x="180" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">STATE</text>
        <text x="304" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">SCORES</text>
      </g>
      <line x1="608" y1="190" x2="608" y2="236" stroke="#22a89c" stroke-width="4"/>
      <polygon points="608,250 598,231 618,231" fill="#22a89c"/>
      <rect x="388" y="250" width="440" height="164" rx="20" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="608" y="290" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">GPU · WIDE SWEEP / EVALUATION</text>
      <text x="608" y="329" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Evaluate candidate lanes</text>
      <g transform="translate(450 350)" fill="#22a89c">
        <rect width="44" height="28" rx="5"/><rect x="54" width="44" height="28" rx="5"/><rect x="108" width="44" height="28" rx="5"/><rect x="162" width="44" height="28" rx="5"/><rect x="216" width="44" height="28" rx="5"/><rect x="270" width="44" height="28" rx="5"/>
      </g>
      <line x1="608" y1="414" x2="608" y2="460" stroke="#22a89c" stroke-width="4"/>
      <polygon points="608,474 598,455 618,455" fill="#22a89c"/>
      <rect x="388" y="474" width="440" height="136" rx="20" fill="#142738" stroke="#66758a" stroke-width="2"/>
      <text x="608" y="513" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">CPU · FILTER / DECIDE</text>
      <text x="608" y="550" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Keep survivors · revise constraints</text>
      <text x="608" y="581" text-anchor="middle" fill="#9aa8b8" font-size="15">prepare the next population or schedule</text>
      <path d="M388 542 H330 C275 542 250 505 250 450 V280" fill="none" stroke="#22a89c" stroke-width="4"/>
      <polygon points="250,266 240,285 260,285" fill="#22a89c"/>
      <text x="166" y="420" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">REPEAT</text>
      <circle cx="166" cy="358" r="70" fill="#091522" stroke="#22a89c" stroke-width="2"/>
      <text x="166" y="349" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">HOST</text>
      <text x="166" y="377" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">ORCHESTRATES</text>
    </g>
    <g transform="translate(24 708)">
      <rect width="852" height="68" rx="14" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="22" y="27" fill="#d4833f" font-size="13" letter-spacing="2">CAPACITY ≠ THROUGHPUT</text>
      <text x="22" y="52" fill="#fff" font-size="16" font-weight="700">N=1024 · B=1000 approached 6 GiB and slowed sharply · no speed advantage established</text>
    </g>
  </g>
</svg>
