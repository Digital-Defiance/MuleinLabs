<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">A fair benchmark contract requires the same circuit, work, digest, and failure control</title>
  <desc id="desc">The proposed benchmark sends one deterministic lane-distinct corpus through matched native and HELUT backends, consumes outputs, hashes ordered results and final state, requires a corruption test to fail, and reports setup, steady, end-to-end, throughput, memory, and failures.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(976 88)" font-family="Arial, sans-serif">
    <text x="446" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">PRE-REGISTER BEFORE MEASURING</text>
    <rect x="0" y="50" width="892" height="818" rx="22" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(28 78)">
      <rect width="836" height="86" rx="14" fill="#142738" stroke="#66758a"/>
      <text x="20" y="32" fill="#9aa8b8" font-size="14" letter-spacing="2">01 · IDENTICAL INPUT CONTRACT</text>
      <text x="20" y="62" fill="#fff" font-size="19" font-weight="700">same circuit · deterministic lane-distinct corpus · constant useful work</text>
      <line x1="418" y1="86" x2="418" y2="126" stroke="#66758a" stroke-width="3"/>
      <polygon points="418,138 409,121 427,121" fill="#66758a"/>
      <g transform="translate(0 142)">
        <rect width="258" height="104" rx="14" fill="#142738" stroke="#66758a"/>
        <text x="129" y="34" text-anchor="middle" fill="#9aa8b8" font-size="13" letter-spacing="1">AUTHORED RTL</text>
        <text x="129" y="68" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Verilator native</text>
        <text x="129" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">optimized baseline</text>
        <rect x="289" width="258" height="104" rx="14" fill="#142738" stroke="#66758a"/>
        <text x="418" y="34" text-anchor="middle" fill="#9aa8b8" font-size="13" letter-spacing="1">SAME POST-ABC GRAPH</text>
        <text x="418" y="68" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">native graph build</text>
        <text x="418" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">artifact-matched</text>
        <rect x="578" width="258" height="104" rx="14" fill="#122b35" stroke="#22a89c"/>
        <text x="707" y="34" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">TENSOR BACKEND</text>
        <text x="707" y="68" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">HELUT</text>
        <text x="707" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">same checked work</text>
      </g>
      <g transform="translate(0 272)">
        <rect width="520" height="126" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="20" y="33" fill="#22a89c" font-size="14" letter-spacing="2">02 · CORRECTNESS GATE</text>
        <text x="20" y="66" fill="#fff" font-size="18" font-weight="700">consume outputs in timed implementation</text>
        <text x="20" y="94" fill="#fff" font-size="18" font-weight="700">hash ordered outputs + final state outside timer</text>
        <rect x="540" width="296" height="126" rx="15" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
        <text x="688" y="33" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">NEGATIVE CONTROL</text>
        <text x="688" y="69" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">flip one expected bit</text>
        <text x="688" y="98" text-anchor="middle" fill="#d4833f" font-size="17" font-weight="700">digest MUST FAIL</text>
      </g>
      <g transform="translate(0 424)">
        <text x="0" y="18" fill="#9aa8b8" font-size="14" letter-spacing="2">03 · REPORT THE WHOLE COST</text>
        <g transform="translate(0 38)">
          <rect width="196" height="72" rx="11" fill="#142738"/><rect x="212" width="196" height="72" rx="11" fill="#142738"/><rect x="424" width="196" height="72" rx="11" fill="#142738"/><rect x="636" width="200" height="72" rx="11" fill="#142738"/>
          <text x="98" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">build + compile</text><text x="98" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">first JIT</text>
          <text x="310" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">steady compute</text><text x="310" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">repeated intervals</text>
          <text x="522" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">end-to-end</text><text x="522" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">break-even</text>
          <text x="736" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">vectors / second</text><text x="736" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">useful checked work</text>
          <rect y="88" width="258" height="72" rx="11" fill="#142738"/><rect x="277" y="88" width="258" height="72" rx="11" fill="#142738"/><rect x="554" y="88" width="282" height="72" rx="11" fill="#142738"/>
          <text x="129" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">peak resident memory</text><text x="129" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">same measurement method</text>
          <text x="406" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">trial intervals</text><text x="406" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">not one-run bars</text>
          <text x="695" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">failures + OOM points</text><text x="695" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">losing outcomes remain visible</text>
        </g>
      </g>
      <rect y="650" width="836" height="78" rx="13" fill="#2b2025" stroke="#d4833f"/>
      <text x="418" y="681" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">ONLY THEN</text>
      <text x="418" y="711" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">name a crossover—or report that native stayed ahead</text>
    </g>
  </g>
</svg>
