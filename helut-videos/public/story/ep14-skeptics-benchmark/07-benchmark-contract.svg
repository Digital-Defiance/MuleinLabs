<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The accepted paired contract keeps preparation, execution, strict output consumption, and digest inside both timers</title>
  <desc id="desc">One deterministic lane-distinct corpus crosses matched HELUT and native paths. Both consume all outputs and hash the same ordered lane-wire-value byte stream inside the paired boundary. A corruption control must fail, and unmatched future rows remain open.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(976 88)" font-family="Arial, sans-serif">
    <text x="446" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">FROZEN BEFORE THE SOLE RETAINED RUN</text>
    <rect x="0" y="50" width="892" height="818" rx="22" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(28 78)">
      <rect width="836" height="86" rx="14" fill="#142738" stroke="#66758a"/>
      <text x="20" y="32" fill="#9aa8b8" font-size="14" letter-spacing="2">01 · IDENTICAL CIRCUIT LINEAGE AND CORPUS</text>
      <text x="20" y="62" fill="#fff" font-size="19" font-weight="700">one emitted circuit · deterministic assignments · exhaustive at B=65,536</text>
      <line x1="418" y1="86" x2="418" y2="126" stroke="#66758a" stroke-width="3"/>
      <polygon points="418,138 409,121 427,121" fill="#66758a"/>
      <g transform="translate(0 142)">
        <rect width="258" height="104" rx="14" fill="#2b2025" stroke="#d4833f" stroke-dasharray="8 6"/>
        <text x="129" y="34" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="1">FUTURE ROW</text>
        <text x="129" y="68" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">authored RTL</text>
        <text x="129" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">not in this receipt</text>
        <rect x="289" width="258" height="104" rx="14" fill="#142738" stroke="#7aa2c8"/>
        <text x="418" y="34" text-anchor="middle" fill="#7aa2c8" font-size="13" letter-spacing="1">NATIVE PATH</text>
        <text x="418" y="68" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Verilator · 16 workers</text>
        <text x="418" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">same emitted lineage</text>
        <rect x="578" width="258" height="104" rx="14" fill="#122b35" stroke="#22a89c"/>
        <text x="707" y="34" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">TENSOR PATH</text>
        <text x="707" y="68" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">HELUT</text>
        <text x="707" y="91" text-anchor="middle" fill="#9aa8b8" font-size="13">same checked work</text>
      </g>
      <g transform="translate(0 272)">
        <rect width="520" height="126" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="20" y="33" fill="#22a89c" font-size="14" letter-spacing="2">02 · PAIRED CORRECTNESS BOUNDARY</text>
        <text x="20" y="66" fill="#fff" font-size="18" font-weight="700">strictly read + materialize every output inside timer</text>
        <text x="20" y="94" fill="#fff" font-size="18" font-weight="700">hash ordered lane · wire · value bytes inside timer</text>
        <rect x="540" width="296" height="126" rx="15" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
        <text x="688" y="33" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">NEGATIVE CONTROL</text>
        <text x="688" y="69" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">corrupt one lane</text>
        <text x="688" y="98" text-anchor="middle" fill="#d4833f" font-size="17" font-weight="700">DIGEST MUST MOVE</text>
      </g>
      <g transform="translate(0 424)">
        <text x="0" y="18" fill="#9aa8b8" font-size="14" letter-spacing="2">03 · RETAIN THE WHOLE RESULT</text>
        <g transform="translate(0 38)">
          <rect width="196" height="72" rx="11" fill="#142738"/><rect x="212" width="196" height="72" rx="11" fill="#142738"/><rect x="424" width="196" height="72" rx="11" fill="#142738"/><rect x="636" width="200" height="72" rx="11" fill="#142738"/>
          <text x="98" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">frozen source</text><text x="98" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">binary hash gate</text>
          <text x="310" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">5 raw trials</text><text x="310" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">all 8 widths</text>
          <text x="522" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">phase arrays</text><text x="522" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">zero residuals</text>
          <text x="736" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">ordered digest</text><text x="736" y="54" text-anchor="middle" fill="#9aa8b8" font-size="13">all rows match</text>
          <rect y="88" width="258" height="72" rx="11" fill="#142738"/><rect x="277" y="88" width="258" height="72" rx="11" fill="#142738"/><rect x="554" y="88" width="282" height="72" rx="11" fill="#142738"/>
          <text x="129" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">generated hashes</text><text x="129" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">same fixture lineage</text>
          <text x="406" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">failures retained</text><text x="406" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">no favorable rerun</text>
          <text x="695" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">bounded claim</text><text x="695" y="142" text-anchor="middle" fill="#9aa8b8" font-size="13">one circuit · one host</text>
        </g>
      </g>
      <rect y="650" width="836" height="78" rx="13" fill="#2b2025" stroke="#d4833f"/>
      <text x="418" y="681" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">DIRECT RESULT</text>
      <text x="418" y="711" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">HELUT 15.1% SLOWER · NO PAIRED CROSSOVER THROUGH 65,536</text>
    </g>
  </g>
</svg>
