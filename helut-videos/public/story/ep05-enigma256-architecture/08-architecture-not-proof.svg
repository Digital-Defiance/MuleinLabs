<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Architecture is not security proof</title><desc id="d">Demonstrated architectural and parity properties stop at a boundary before comparative security, production use, and external cryptanalysis.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1070 205) scale(.81)" font-family="Arial,sans-serif"><g><rect width="420" height="470" rx="30" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="210" y="55" text-anchor="middle" fill="#22a89c" font-size="18" letter-spacing="3">BOUNDED EVIDENCE</text><g transform="translate(62 105)" fill="#fff" font-size="24"><text y="0">✓ reciprocal byte path</text><text y="58">✓ frozen fixture identity</text><text y="116">✓ Swift / RTL parity</text><text y="174">✓ counter-state traces</text><text y="232">✓ finite structural checks</text></g></g><path d="M455 235h95" stroke="#d4833f" stroke-width="8"/><path d="M535 216l30 19-30 19" fill="#d4833f"/><g transform="translate(580)"><rect width="420" height="470" rx="30" fill="#321b23" stroke="#d4833f" stroke-width="3"/><text x="210" y="55" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="3">NOT ESTABLISHED</text><g transform="translate(62 105)" fill="#fff" font-size="24"><text y="0">× comparative strength</text><text y="58">× IND-CPA security</text><text y="116">× production suitability</text><text y="174">× side-channel resistance</text><text y="232">× external cryptanalysis</text></g></g><rect x="135" y="535" width="730" height="112" rx="22" fill="#2b2025" stroke="#d4833f"/><text x="500" y="578" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">EXPERIMENTAL RESEARCH PROTOTYPE</text><text x="500" y="616" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Use standardized authenticated encryption for real data.</text></g></svg>