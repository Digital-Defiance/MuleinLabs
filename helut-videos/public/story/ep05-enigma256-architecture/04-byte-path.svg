<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 reciprocal byte path</title><desc id="d">A byte passes through the plugboard, four forward rotors, center-mask XOR, four inverse rotors, and the same plugboard.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(990 220) scale(.92)" font-family="Arial,sans-serif"><text x="490" y="28" text-anchor="middle" fill="#9aa8b8" font-size="18" letter-spacing="3">TEN SERIAL ACCESSES · NINE UNIQUE TABLES</text><g transform="translate(0 80)" font-size="17"><g fill="#142738" stroke="#22a89c"><rect width="125" height="90" rx="16"/><rect x="145" width="125" height="90" rx="16"/><rect x="290" width="125" height="90" rx="16"/><rect x="435" width="125" height="90" rx="16"/><rect x="580" width="125" height="90" rx="16"/></g><g fill="#fff"><text x="62" y="53" text-anchor="middle">plugboard</text><text x="207" y="53" text-anchor="middle">rotor 1 →</text><text x="352" y="53" text-anchor="middle">rotor 2 →</text><text x="497" y="53" text-anchor="middle">rotor 3 →</text><text x="642" y="53" text-anchor="middle">rotor 4 →</text></g><path d="M125 45h20M270 45h20M415 45h20M560 45h20" stroke="#22a89c" stroke-width="4"/><rect x="725" width="180" height="90" rx="16" fill="#282235" stroke="#d4833f" stroke-width="3"/><text x="815" y="38" text-anchor="middle" fill="#d4833f" font-size="16">CENTER MASK</text><text x="815" y="66" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">XOR kᵢ</text><path d="M705 45h20" stroke="#d4833f" stroke-width="4"/></g><path d="M905 345c70 0 70 115 0 115" fill="none" stroke="#d4833f" stroke-width="4"/><g transform="translate(0 355)" font-size="17"><g fill="#142738" stroke="#22a89c"><rect width="125" height="90" rx="16"/><rect x="145" width="125" height="90" rx="16"/><rect x="290" width="125" height="90" rx="16"/><rect x="435" width="125" height="90" rx="16"/><rect x="580" width="125" height="90" rx="16"/></g><g fill="#fff"><text x="62" y="53" text-anchor="middle">plugboard</text><text x="207" y="53" text-anchor="middle">← rotor 1⁻¹</text><text x="352" y="53" text-anchor="middle">← rotor 2⁻¹</text><text x="497" y="53" text-anchor="middle">← rotor 3⁻¹</text><text x="642" y="53" text-anchor="middle">← rotor 4⁻¹</text></g><path d="M145 45h-20M290 45h-20M435 45h-20M580 45h-20M725 45h-20" stroke="#22a89c" stroke-width="4"/><path d="M725 45h180" stroke="#d4833f" stroke-width="4"/></g><path d="M62 435v80h753v-80" fill="none" stroke="#66758a" stroke-width="3" stroke-dasharray="8 8"/><text x="438" y="555" text-anchor="middle" fill="#22a89c" font-size="23" font-weight="700">same frozen-state path encrypts and decrypts</text><text x="438" y="592" text-anchor="middle" fill="#9aa8b8" font-size="19">reciprocity is functional evidence—not confidentiality</text></g></svg>