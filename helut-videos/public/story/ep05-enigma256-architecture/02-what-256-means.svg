<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">What 256 means in E256</title><desc id="d">A 26-letter ring is compared with a 256-value byte grid, with a warning that byte width is not a security-bit claim.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(990 195) scale(.94)" font-family="Arial,sans-serif"><g transform="translate(25 35)"><circle cx="190" cy="190" r="150" fill="#142738" stroke="#d4833f" stroke-width="4"/><circle cx="190" cy="190" r="95" fill="none" stroke="#66758a" stroke-width="3" stroke-dasharray="7 10"/><text x="190" y="180" text-anchor="middle" fill="#fff" font-size="54" font-weight="700">26</text><text x="190" y="220" text-anchor="middle" fill="#9aa8b8" font-size="21">letters</text><text x="190" y="385" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">M4 ALPHABET</text></g><path d="M410 225h120" stroke="#66758a" stroke-width="5"/><path d="M515 208l28 17-28 17" fill="#66758a"/><g transform="translate(555 35)"><rect width="400" height="380" rx="28" fill="#142738" stroke="#22a89c" stroke-width="4"/><g transform="translate(45 65)" fill="#22a89c"><rect width="34" height="34" rx="5"/><rect x="46" width="34" height="34" rx="5" fill-opacity=".25"/><rect x="92" width="34" height="34" rx="5"/><rect x="138" width="34" height="34" rx="5" fill-opacity=".25"/><rect x="184" width="34" height="34" rx="5"/><rect x="230" width="34" height="34" rx="5" fill-opacity=".25"/><rect x="276" width="34" height="34" rx="5"/></g><text x="200" y="195" text-anchor="middle" fill="#fff" font-size="62" font-weight="700">256</text><text x="200" y="238" text-anchor="middle" fill="#9aa8b8" font-size="22">byte values · 00…FF</text><text x="200" y="325" text-anchor="middle" fill="#22a89c" font-size="18" letter-spacing="2">E256 DATAPATH</text></g><rect x="75" y="500" width="835" height="130" rx="22" fill="#321b23" stroke="#d4833f" stroke-width="3"/><text x="492" y="550" text-anchor="middle" fill="#d4833f" font-size="20" letter-spacing="3">WIDTH ≠ SECURITY LEVEL</text><text x="492" y="595" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">BASE 256 · NOT “256-BIT SECURITY”</text><text x="492" y="680" text-anchor="middle" fill="#9aa8b8" font-size="19">The comparative security level is unknown.</text></g></svg>