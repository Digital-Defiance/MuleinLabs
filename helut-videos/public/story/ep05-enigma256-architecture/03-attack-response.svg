<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">M4 attack surface and E256 response matrix</title><desc id="d">Four historical attack conveniences are paired with architectural responses and an unknown column.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(985 150) scale(.9)" font-family="Arial,sans-serif"><text x="150" y="35" fill="#d4833f" font-size="17" letter-spacing="2">M4 ATTACK SURFACE</text><text x="480" y="35" fill="#22a89c" font-size="17" letter-spacing="2">E256 RESPONSE</text><text x="820" y="35" fill="#9aa8b8" font-size="17" letter-spacing="2">STILL UNKNOWN</text><g transform="translate(0 65)" font-size="20"><g><rect width="970" height="125" rx="18" fill="#151d2b" stroke="#33445a"/><text x="28" y="48" fill="#fff" font-weight="700">26-letter alphabet</text><text x="28" y="82" fill="#9aa8b8">dense menus · affordable sweeps</text><text x="355" y="48" fill="#22a89c" font-weight="700">00…FF byte alphabet</text><text x="355" y="82" fill="#9aa8b8">full 256-value path</text><text x="700" y="63" fill="#d4833f">adapted statistics</text></g><g transform="translate(0 145)"><rect width="970" height="125" rx="18" fill="#181d2a" stroke="#33445a"/><text x="28" y="48" fill="#fff" font-weight="700">Reflector law</text><text x="28" y="82" fill="#9aa8b8">self-map rejection</text><text x="355" y="48" fill="#22a89c" font-weight="700">Conjugated XOR center</text><text x="355" y="82" fill="#9aa8b8">no live reflector</text><text x="700" y="63" fill="#d4833f">new algebraic structure</text></g><g transform="translate(0 290)"><rect width="970" height="125" rx="18" fill="#151d2b" stroke="#33445a"/><text x="28" y="48" fill="#fff" font-weight="700">Odometer stepping</text><text x="28" y="82" fill="#9aa8b8">short-message reductions</text><text x="355" y="48" fill="#22a89c" font-weight="700">Four step enables</text><text x="355" y="82" fill="#9aa8b8">nonlinear filtered state</text><text x="700" y="63" fill="#d4833f">schedule reductions</text></g><g transform="translate(0 435)"><rect width="970" height="125" rx="18" fill="#181d2a" stroke="#33445a"/><text x="28" y="48" fill="#fff" font-weight="700">10-pair board · paper keys</text><text x="28" y="82" fill="#9aa8b8">completion + capture risk</text><text x="355" y="48" fill="#22a89c" font-weight="700">Full involution · host derivation</text><text x="355" y="82" fill="#9aa8b8">256 entries · nonce state</text><text x="700" y="63" fill="#d4833f">protocol + trust surface</text></g></g><text x="485" y="695" text-anchor="middle" fill="#d4833f" font-size="21">ARCHITECTURAL RESPONSE · NOT PROOF THAT AN ADAPTED ATTACK FAILS</text></g></svg>