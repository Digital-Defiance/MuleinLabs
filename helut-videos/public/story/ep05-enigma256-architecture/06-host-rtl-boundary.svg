<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 host and RTL trust boundary</title><desc id="d">The host owns authentication and mask derivation, while RTL receives an atomic tuple, validates its counter, and transforms the byte.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1050 175) scale(.82)" font-family="Arial,sans-serif"><g><rect width="430" height="520" rx="30" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="215" y="52" text-anchor="middle" fill="#22a89c" font-size="18" letter-spacing="3">HOST CONTROL PLANE</text><g fill="#fff" font-size="24"><text x="55" y="125">handshake</text><text x="55" y="180">key derivation</text><text x="55" y="235">container authentication</text><text x="55" y="290">nonce discipline</text><text x="55" y="345">center-mask schedule</text></g><rect x="50" y="405" width="330" height="70" rx="15" fill="#102b32" stroke="#22a89c"/><text x="215" y="447" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">owns secret authentication keys</text></g><g transform="translate(570)"><rect width="430" height="520" rx="30" fill="#282235" stroke="#d4833f" stroke-width="3"/><text x="215" y="52" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="3">RTL DATA PLANE</text><g fill="#fff" font-size="24"><text x="55" y="125">nine active tables</text><text x="55" y="180">counter comparison</text><text x="55" y="235">byte transformation</text><text x="55" y="290">state transition</text></g><rect x="50" y="345" width="330" height="130" rx="15" fill="#321b23" stroke="#d4833f"/><text x="215" y="385" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">DOES NOT</text><text x="215" y="421" text-anchor="middle" fill="#fff" font-size="20">hold the auth key</text><text x="215" y="451" text-anchor="middle" fill="#fff" font-size="20">derive or validate the mask</text></g><path d="M430 220h140" stroke="#fff" stroke-width="5"/><path d="M552 204l27 16-27 16" fill="#fff"/><rect x="400" y="115" width="200" height="78" rx="16" fill="#101a2b" stroke="#66758a"/><text x="500" y="145" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="1">ATOMIC TUPLE</text><text x="500" y="174" text-anchor="middle" fill="#fff" font-size="18">payload · mask · counter</text><rect x="150" y="590" width="700" height="100" rx="20" fill="#2b2025" stroke="#d4833f"/><text x="500" y="629" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">EXPLICIT TRUST BOUNDARY</text><text x="500" y="665" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Counter validation is not mask authentication.</text></g></svg>