<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">One accepted E256 byte in time</title><desc id="d">A six-step timing strip validates the tuple, transforms, emits, applies the step mask, clocks state, and increments the counter; mismatch branches to no state advance.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1000 205) scale(.9)" font-family="Arial,sans-serif"><path d="M85 250h835" stroke="#66758a" stroke-width="6"/><g fill="#142738" stroke="#22a89c" stroke-width="3"><circle cx="85" cy="250" r="58"/><circle cx="250" cy="250" r="58"/><circle cx="415" cy="250" r="58"/><circle cx="580" cy="250" r="58"/><circle cx="745" cy="250" r="58"/><circle cx="910" cy="250" r="58"/></g><g fill="#fff" text-anchor="middle" font-size="19" font-weight="700"><text x="85" y="244">snapshot</text><text x="85" y="268">tuple</text><text x="250" y="244">compare</text><text x="250" y="268">counter</text><text x="415" y="244">transform</text><text x="415" y="268">current state</text><text x="580" y="256">emit</text><text x="745" y="244">apply</text><text x="745" y="268">step mask</text><text x="910" y="244">clock +</text><text x="910" y="268">increment</text></g><g fill="#22a89c" font-size="16" text-anchor="middle"><text x="85" y="340">01</text><text x="250" y="340">02</text><text x="415" y="340">03</text><text x="580" y="340">04</text><text x="745" y="340">05</text><text x="910" y="340">06</text></g><path d="M250 192V90H620" fill="none" stroke="#d4833f" stroke-width="4" stroke-dasharray="9 8"/><rect x="620" y="35" width="350" height="110" rx="20" fill="#321b23" stroke="#d4833f" stroke-width="2"/><text x="795" y="76" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">COUNTER MISMATCH</text><text x="795" y="112" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">error · no output · no advance</text><rect x="180" y="435" width="640" height="105" rx="20" fill="#101a2b" stroke="#66758a"/><text x="500" y="478" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Update order is part of the compatibility identity.</text><text x="500" y="513" text-anchor="middle" fill="#9aa8b8" font-size="18">Changing the order changes the stream.</text></g></svg>