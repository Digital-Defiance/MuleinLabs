<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 day material and message state</title><desc id="d">A 16-rotor pool and full plugboard feed a nonce-selected four-rotor active slot with nine tables and per-byte stepping state.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1050 180) scale(.83)" font-family="Arial,sans-serif"><g><rect width="300" height="285" rx="28" fill="#142738" stroke="#22a89c" stroke-width="2"/><text x="150" y="46" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">DAY MATERIAL</text><text x="150" y="92" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">1 plugboard</text><text x="150" y="128" text-anchor="middle" fill="#9aa8b8" font-size="18">256-entry involution</text><text x="150" y="185" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">16 rotor pairs</text><text x="150" y="221" text-anchor="middle" fill="#9aa8b8" font-size="18">forward + inverse tables</text></g><path d="M300 142h85" stroke="#d4833f" stroke-width="5"/><g transform="translate(385)"><rect width="260" height="285" rx="28" fill="#282235" stroke="#d4833f" stroke-width="2"/><text x="130" y="46" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">MESSAGE NONCE</text><text x="130" y="95" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">choose 4 rotors</text><text x="130" y="132" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">choose 4 offsets</text><text x="130" y="169" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">state seed</text><text x="130" y="206" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">center key</text></g><path d="M645 142h85" stroke="#22a89c" stroke-width="5"/><g transform="translate(730)"><rect width="260" height="285" rx="28" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="130" y="46" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">ACTIVE SLOT</text><text x="130" y="104" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">9 tables</text><text x="130" y="143" text-anchor="middle" fill="#9aa8b8" font-size="19">plugboard + 4 pairs</text><text x="130" y="204" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">2,304 bytes</text><text x="130" y="240" text-anchor="middle" fill="#9aa8b8" font-size="18">loaded to hardware</text></g><g transform="translate(110 375)"><rect width="770" height="210" rx="28" fill="#1a2130" stroke="#66758a"/><text x="385" y="45" text-anchor="middle" fill="#9aa8b8" font-size="17" letter-spacing="2">AFTER EACH ACCEPTED BYTE</text><circle cx="125" cy="118" r="48" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="125" y="125" text-anchor="middle" fill="#fff" font-size="19">64-bit state</text><path d="M173 118h80" stroke="#22a89c" stroke-width="4"/><rect x="253" y="72" width="210" height="92" rx="18" fill="#282235" stroke="#d4833f"/><text x="358" y="108" text-anchor="middle" fill="#d4833f" font-size="16">NONLINEAR FILTER</text><text x="358" y="138" text-anchor="middle" fill="#fff" font-size="20">4 step enables</text><path d="M463 118h80" stroke="#d4833f" stroke-width="4"/><g transform="translate(545 75)" fill="#142738" stroke="#22a89c"><circle cx="35" cy="43" r="34"/><circle cx="105" cy="43" r="34"/><circle cx="175" cy="43" r="34"/></g><text x="650" y="185" text-anchor="middle" fill="#9aa8b8" font-size="17">up to four rotors step</text></g></g></svg>