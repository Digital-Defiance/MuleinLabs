<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 counter-history</title><desc id="d">A historical rotor silhouette is redirected through an audit ledger into a modern defensive circuit, without celebratory military imagery.</desc><defs><radialGradient id="b" cx="78%" cy="42%"><stop stop-color="#17424b"/><stop offset="1" stop-color="#08111f"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#b)"/><g transform="translate(1040 190) scale(.92)" font-family="Arial,sans-serif"><g transform="translate(130 190)" fill="none"><circle cx="160" cy="160" r="145" stroke="#66758a" stroke-width="4" stroke-dasharray="8 12"/><circle cx="160" cy="160" r="102" stroke="#d4833f" stroke-width="4" stroke-dasharray="18 8"/><circle cx="160" cy="160" r="58" stroke="#9aa8b8" stroke-width="3"/><text x="160" y="370" text-anchor="middle" fill="#9aa8b8" font-size="18" letter-spacing="2">HISTORICAL MACHINE</text></g><path d="M470 350h135" stroke="#d4833f" stroke-width="6"/><path d="M590 333l28 17-28 17" fill="#d4833f"/><g transform="translate(620 165)"><rect width="300" height="365" rx="28" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="150" y="55" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">DEFENSIVE REWRITE</text><g transform="translate(54 105)" fill="none" stroke="#22a89c" stroke-width="4"><path d="M0 35h55v70h60v-70h75"/><circle cx="0" cy="35" r="9" fill="#22a89c"/><circle cx="55" cy="105" r="9" fill="#22a89c"/><circle cx="115" cy="35" r="9" fill="#22a89c"/><circle cx="190" cy="35" r="9" fill="#22a89c"/></g><text x="150" y="255" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">E256</text><text x="150" y="294" text-anchor="middle" fill="#9aa8b8" font-size="18">byte-wide · reciprocal</text><text x="150" y="324" text-anchor="middle" fill="#9aa8b8" font-size="18">experimental · audited</text></g><rect x="125" y="590" width="795" height="105" rx="20" fill="#2b2025" stroke="#d4833f"/><text x="522" y="632" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">COUNTER-HISTORY</text><text x="522" y="669" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Reverse the symbolism · publish the weaknesses · build defensively</text><text x="522" y="745" text-anchor="middle" fill="#9aa8b8" font-size="18">Personal motivation is not cryptographic evidence.</text></g></svg>