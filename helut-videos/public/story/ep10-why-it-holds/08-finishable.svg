<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The current oracle plug-seeding ladder</title>
  <desc id="d">With zero oracle plugs the median margin is minus zero point one two two six. Four oracle plugs flip it to plus zero point three three zero eight, and eight recover all ten plugs and all plaintext on ten controls. This is an upper bound, not a break.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 142)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">ORACLE-CORRECT PLUGS AT TRUTH · RANDOM PLUGS AT DECOYS</text>

    <g transform="translate(0 44)">
      <rect width="255" height="112" rx="16" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
      <text x="127" y="29" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="2">K = 0</text>
      <text x="127" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">−0.1226</text>
      <text x="127" y="94" text-anchor="middle" fill="#9aa8b8" font-size="16">1/10 plugs · 7%</text>
    </g>
    <g transform="translate(287 44)">
      <rect width="255" height="112" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <text x="127" y="29" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">K = 4 · SIGN FLIPS</text>
      <text x="127" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">+0.3308</text>
      <text x="127" y="94" text-anchor="middle" fill="#9aa8b8" font-size="16">6/10 plugs · 47%</text>
    </g>
    <g transform="translate(575 44)">
      <rect width="255" height="112" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <text x="127" y="29" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">K = 8 · COMPLETE</text>
      <text x="127" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">+1.0488</text>
      <text x="127" y="94" text-anchor="middle" fill="#9aa8b8" font-size="16">10/10 plugs · 100%</text>
    </g>

    <rect x="0" y="184" width="830" height="102" rx="16" fill="#2b2025" stroke="#d4833f" stroke-width="3"/>
    <text x="415" y="215" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">READ THIS PRECISELY</text>
    <text x="415" y="250" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">the correct seed plugs come from the known key</text>
    <text x="415" y="276" text-anchor="middle" fill="#9aa8b8" font-size="17">the experiment finishes a true stop; it does not find one</text>

    <text x="415" y="340" text-anchor="middle" fill="#9aa8b8" font-size="19">Oracle-seeded upper bound · ranking benchmark · not a break.</text>
  </g>
</svg>
