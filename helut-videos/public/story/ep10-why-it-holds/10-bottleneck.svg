<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The bottleneck is data, not silicon</title>
  <desc id="d">The scoring corpus is about ten thousand three hundred letters, roughly fifteen counts per bigram cell, where published attacks use tables built from millions. The deterministic alternative eliminates hypotheses by contradiction instead of fitting them.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 150)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">WHAT WOULD ACTUALLY MOVE IT</text>

    <g transform="translate(0 40)">
      <rect width="405" height="92" rx="14" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="1">THIS CORPUS</text>
      <text x="202" y="62" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">≈10,300 letters</text>
      <text x="202" y="82" text-anchor="middle" fill="#9aa8b8" font-size="16">~15 counts per bigram cell</text>
    </g>
    <g transform="translate(425 40)">
      <rect width="405" height="92" rx="14" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="1">PUBLISHED WORK USES</text>
      <text x="202" y="62" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">millions</text>
      <text x="202" y="82" text-anchor="middle" fill="#9aa8b8" font-size="16">tri- and quadgram tables</text>
    </g>

    <text x="415" y="164" text-anchor="middle" fill="#d4833f" font-size="19" font-weight="700">A data problem — and it gates everything else.</text>

    <g transform="translate(0 188)">
      <rect width="830" height="66" rx="14" fill="#142738" stroke="#66758a"/>
      <text x="24" y="28" fill="#9aa8b8" font-size="14" letter-spacing="2">SECOND</text>
      <text x="24" y="52" fill="#fff" font-size="19">climb at every setting — the sieve throws the answer away</text>
    </g>

    <g transform="translate(0 268)">
      <rect width="830" height="82" rx="14" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="24" y="28" fill="#22a89c" font-size="14" letter-spacing="2">THIRD · THE DETERMINISTIC ROUTE</text>
      <text x="24" y="56" fill="#fff" font-size="19">crib logic eliminates by contradiction, not by fitting</text>
      <text x="24" y="76" fill="#9aa8b8" font-size="16">historically, this is the method that worked</text>
    </g>

    <text x="415" y="400" text-anchor="middle" fill="#9aa8b8" font-size="19">Statistics can rank a shortlist. They cannot search this space.</text>
  </g>
</svg>
