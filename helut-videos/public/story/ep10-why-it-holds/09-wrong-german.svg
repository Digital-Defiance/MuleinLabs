<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Naval specialization does not rescue the seventy-two-letter row</title>
  <desc id="d">At seventy-two letters the generic model wins five of thirty controls with median margin minus zero point two three zero six, while the leave-one-out naval model wins four with minus zero point two four nine six. Naval helps only at the already-winning two-hundred-fifty-two-letter row.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 142)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">TARGET LENGTH · 72 LETTERS · 30 CONTROLS</text>

    <g transform="translate(0 46)">
      <rect width="405" height="126" rx="16" fill="#142738" stroke="#7aa2c8" stroke-width="2"/>
      <text x="202" y="31" text-anchor="middle" fill="#7aa2c8" font-size="14" letter-spacing="2">GENERIC 28.5M MODEL</text>
      <text x="202" y="72" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">5 / 30 wins</text>
      <text x="202" y="104" text-anchor="middle" fill="#e0574c" font-size="19">margin −0.2306</text>
    </g>
    <g transform="translate(425 46)">
      <rect width="405" height="126" rx="16" fill="#282235" stroke="#d4833f" stroke-width="2"/>
      <text x="202" y="31" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">NAVAL LEAVE-ONE-OUT</text>
      <text x="202" y="72" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">4 / 30 wins</text>
      <text x="202" y="104" text-anchor="middle" fill="#e0574c" font-size="19">margin −0.2496</text>
    </g>

    <text x="415" y="214" text-anchor="middle" fill="#e0574c" font-size="20" font-weight="700">At the target length, naval is slightly worse.</text>

    <rect x="0" y="246" width="830" height="82" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
    <text x="24" y="277" fill="#22a89c" font-size="14" letter-spacing="2">AT 252 LETTERS · ALREADY WINNING</text>
    <text x="24" y="310" fill="#fff" font-size="20">generic +0.9273 → naval +1.1531 · both 3 / 3</text>

    <text x="415" y="374" text-anchor="middle" fill="#9aa8b8" font-size="18">Useful long-message sharpening is not a short-message rescue.</text>
  </g>
</svg>
