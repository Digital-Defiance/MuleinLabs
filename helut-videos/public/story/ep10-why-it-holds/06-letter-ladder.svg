<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The current seventy-two-letter crib-free margin remains negative</title>
  <desc id="d">The approximately two-hundred-letter crossing is an August historical baseline. The current dependent rerun did not sample exactly two hundred letters; at the seventy-two-letter target the generic median margin is minus zero point two three zero six.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 150)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">HOW SHORT A MESSAGE THE METHOD REACHES</text>

    <line x1="40" y1="112" x2="800" y2="112" stroke="#66758a" stroke-width="3"/>
    <g>
      <line x1="120" y1="94" x2="120" y2="130" stroke="#e0574c" stroke-width="4"/>
      <text x="120" y="78" text-anchor="middle" fill="#e0574c" font-size="16" font-weight="700">72</text>
      <text x="120" y="156" text-anchor="middle" fill="#9aa8b8" font-size="15">target</text>
    </g>
    <g>
      <line x1="200" y1="94" x2="200" y2="130" stroke="#d4833f" stroke-width="4"/>
      <text x="200" y="78" text-anchor="middle" fill="#d4833f" font-size="16" font-weight="700">78</text>
      <text x="200" y="156" text-anchor="middle" fill="#9aa8b8" font-size="15">published record</text>
    </g>
    <g>
      <line x1="640" y1="94" x2="640" y2="130" stroke="#66758a" stroke-width="4" stroke-dasharray="8 6"/>
      <text x="640" y="78" text-anchor="middle" fill="#9aa8b8" font-size="16" font-weight="700">≈200</text>
      <text x="640" y="156" text-anchor="middle" fill="#9aa8b8" font-size="15">August crossing</text>
    </g>

    <rect x="0" y="206" width="830" height="84" rx="16" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
    <text x="415" y="235" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="2">CURRENT TARGET-LENGTH ROW</text>
    <text x="415" y="272" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">5 / 30 wins · median margin −0.2306</text>

    <text x="415" y="334" text-anchor="middle" fill="#d4833f" font-size="19" font-weight="700">The current rerun did not sample an exact new crossing.</text>
    <text x="415" y="370" text-anchor="middle" fill="#9aa8b8" font-size="18">At 72 letters, the ranking benchmark remains negative.</text>
  </g>
</svg>
