<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The climb walks away from the answer</title>
  <desc id="d">Started at the true rotor setting, the plugboard climb recovers four of seventy-two letters and none of the ten plugs, settling on a wrong configuration that scores minus 3.127 against the truth's minus 2.872.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 150)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">STARTED ON THE TRUE ROTOR SETTING</text>

    <g transform="translate(30 44)">
      <circle cx="20" cy="40" r="12" fill="#22a89c"/>
      <text x="20" y="18" text-anchor="middle" fill="#22a89c" font-size="14" font-weight="700">TRUTH</text>
      <text x="20" y="74" text-anchor="middle" fill="#fff" font-size="17">−2.872</text>
      <path d="M40 40 C 130 40, 190 76, 300 76" fill="none" stroke="#e0574c" stroke-width="4" stroke-dasharray="10 7"/>
      <path d="M292 68l10 8-10 8" fill="none" stroke="#e0574c" stroke-width="4"/>
      <circle cx="320" cy="76" r="12" fill="#e0574c"/>
      <text x="320" y="112" text-anchor="middle" fill="#fff" font-size="17">−3.127</text>
      <text x="320" y="18" text-anchor="middle" fill="#e0574c" font-size="14" font-weight="700">WHERE IT LANDED</text>
      <text x="520" y="48" fill="#9aa8b8" font-size="17">scores better</text>
      <text x="520" y="76" fill="#9aa8b8" font-size="17">by its own measure</text>
    </g>

    <g transform="translate(0 184)">
      <rect width="405" height="82" rx="14" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="1">LETTERS RECOVERED</text>
      <text x="202" y="64" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">4 of 72</text>
    </g>
    <g transform="translate(425 184)">
      <rect width="405" height="82" rx="14" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="1">PLUG PAIRS RECOVERED</text>
      <text x="202" y="64" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">0 of 10</text>
    </g>

    <text x="415" y="308" text-anchor="middle" fill="#d4833f" font-size="20" font-weight="700">It did not fail to find the summit.</text>
    <text x="415" y="342" text-anchor="middle" fill="#9aa8b8" font-size="19">It walked downhill, because downhill measured as up.</text>
  </g>
</svg>
