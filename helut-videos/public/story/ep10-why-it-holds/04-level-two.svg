<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The scorer correction moved the known-shell climb</title>
  <desc id="d">The same seventy-two-letter control recovered four letters and no plugs with the sparse August model, twenty-one letters and four plugs with the dense table, and twenty-five letters and five plugs with the repaired objective. Every checkpoint remained no break.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 126)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">SAME TRUE ROTOR SETTING · SAME 72-LETTER CONTROL</text>

    <g transform="translate(0 44)">
      <rect width="830" height="82" rx="14" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="24" y="28" fill="#d4833f" font-size="14" letter-spacing="2">AUGUST · SPARSE BIGRAM MODEL</text>
      <text x="24" y="61" fill="#fff" font-size="22" font-weight="700">4 / 72 letters · 0 / 10 true plugs</text>
      <text x="792" y="51" text-anchor="end" fill="#e0574c" font-size="17" font-weight="700">NO BREAK</text>
    </g>

    <g transform="translate(0 142)">
      <rect width="830" height="82" rx="14" fill="#142738" stroke="#7aa2c8" stroke-width="2"/>
      <text x="24" y="28" fill="#7aa2c8" font-size="14" letter-spacing="2">DENSE TABLE ONLY</text>
      <text x="24" y="61" fill="#fff" font-size="22" font-weight="700">21 / 72 letters · 4 / 10 true plugs</text>
      <text x="792" y="51" text-anchor="end" fill="#e0574c" font-size="17" font-weight="700">NO BREAK</text>
    </g>

    <g transform="translate(0 240)">
      <rect width="830" height="82" rx="14" fill="#122b35" stroke="#22a89c" stroke-width="3"/>
      <text x="24" y="28" fill="#22a89c" font-size="14" letter-spacing="2">CURRENT · REPAIRED OBJECTIVE</text>
      <text x="24" y="61" fill="#fff" font-size="22" font-weight="700">25 / 72 letters · 5 / 10 true plugs</text>
      <text x="792" y="51" text-anchor="end" fill="#e0574c" font-size="17" font-weight="700">NO BREAK</text>
    </g>

    <text x="415" y="362" text-anchor="middle" fill="#9aa8b8" font-size="17">Level-one rank stays 223,118 / 456,976 in all three rows.</text>
    <text x="415" y="397" text-anchor="middle" fill="#d4833f" font-size="20" font-weight="700">A real improvement is not the same thing as a break.</text>
  </g>
</svg>
