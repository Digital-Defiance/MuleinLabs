<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">One flip-flop short</title>
  <desc id="d">About two thousand encrypted look-up-table evaluations complete, then one flip-flop cell disagrees. A smaller size passes, and a reduced wire dimension passes at full size.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 160)" font-family="Arial,sans-serif">
    <text x="415" y="18" text-anchor="middle" fill="#9aa8b8" font-size="16" letter-spacing="3">ONE ENCRYPTED PROCESSOR TICK</text>

    <rect x="20" y="46" width="640" height="62" rx="12" fill="#142738" stroke="#22a89c" stroke-width="2"/>
    <text x="340" y="72" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">COMBINATIONAL · COMPLETE</text>
    <text x="340" y="96" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">~2,006 encrypted LUT evaluations · ~33 min</text>

    <rect x="674" y="46" width="136" height="62" rx="12" fill="#33161b" stroke="#e0574c" stroke-width="3"/>
    <text x="742" y="72" text-anchor="middle" fill="#e0574c" font-size="15" letter-spacing="1">1 DFF</text>
    <text x="742" y="96" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">want 0 · got 1</text>

    <text x="415" y="146" text-anchor="middle" fill="#e0574c" font-size="19">Finer encoding did not fix it. The failing cell is named in the log.</text>
    <text x="415" y="176" text-anchor="middle" fill="#9aa8b8" font-size="17">Re-run after the determinism fix: fails identically — structural, not flaky.</text>

    <path d="M120 196v40M710 196v40" stroke="#66758a" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="415" y="222" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="2">TWO ROUTES THAT DO PASS</text>

    <g transform="translate(20 246)">
      <rect width="380" height="150" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="190" y="34" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">SMALLER SIZE</text>
      <text x="190" y="76" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">PASS · 1.72 s</text>
      <text x="190" y="112" text-anchor="middle" fill="#9aa8b8" font-size="18">same netlist, larger margin</text>
      <text x="190" y="136" text-anchor="middle" fill="#22a89c" font-size="17">lever: margin per step</text>
    </g>
    <g transform="translate(430 246)">
      <rect width="380" height="150" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="190" y="34" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">REDUCED WIRE DIMENSION</text>
      <text x="190" y="76" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">PASS · 114 s</text>
      <text x="190" y="112" text-anchor="middle" fill="#9aa8b8" font-size="18">full production size</text>
      <text x="190" y="136" text-anchor="middle" fill="#22a89c" font-size="17">lever: extract then key-switch</text>
    </g>

    <text x="415" y="440" text-anchor="middle" fill="#d4833f" font-size="21" font-weight="700">The capability exists. One cell blocks the direct road.</text>
  </g>
</svg>
