<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Correct is not the same as proven</title>
  <desc id="d">Encrypted output can match cleartext output while the formal error bound stays unstable, and the same circuit can pass one encoding path and fail its neighbour.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1010 165)" font-family="Arial,sans-serif">
    <text x="405" y="18" text-anchor="middle" fill="#9aa8b8" font-size="16" letter-spacing="3">TWO DIFFERENT ACHIEVEMENTS</text>

    <g transform="translate(20 52)">
      <rect width="370" height="176" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="185" y="36" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">CORRECTNESS</text>
      <text x="185" y="82" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">PASS</text>
      <text x="185" y="118" text-anchor="middle" fill="#9aa8b8" font-size="18">encrypted ≡ clear</text>
      <text x="185" y="148" text-anchor="middle" fill="#9aa8b8" font-size="18">on every tested path</text>
    </g>
    <g transform="translate(420 52)">
      <rect width="370" height="176" rx="18" fill="#282235" stroke="#d4833f" stroke-width="2"/>
      <text x="185" y="36" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">FORMAL BOUND</text>
      <text x="185" y="82" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">UNSTABLE</text>
      <text x="185" y="118" text-anchor="middle" fill="#9aa8b8" font-size="18">swings with trial count</text>
      <text x="185" y="148" text-anchor="middle" fill="#9aa8b8" font-size="18">not yet certifiable</text>
    </g>

    <text x="405" y="266" text-anchor="middle" fill="#d4833f" font-size="20" font-weight="700">Collapsing these two is how projects start overclaiming.</text>

    <path d="M405 286v34" stroke="#66758a" stroke-width="3" stroke-dasharray="8 8"/>

    <rect x="20" y="320" width="770" height="118" rx="18" fill="#101a2b" stroke="#66758a"/>
    <text x="405" y="350" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="2">SAME CIRCUIT · ADJACENT ENCODING</text>
    <text x="212" y="392" text-anchor="middle" fill="#22a89c" font-size="22" font-weight="700">route A · PASS</text>
    <text x="405" y="392" text-anchor="middle" fill="#66758a" font-size="22">vs</text>
    <text x="598" y="392" text-anchor="middle" fill="#e0574c" font-size="22" font-weight="700">route B · FAIL</text>
    <text x="405" y="424" text-anchor="middle" fill="#9aa8b8" font-size="18">The boundary lives in the encoding, not the scale.</text>
  </g>
</svg>
