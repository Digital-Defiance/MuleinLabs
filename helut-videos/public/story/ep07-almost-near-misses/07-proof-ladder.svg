<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The proof ladder stops at two tables</title>
  <desc id="d">One fully observed look-up table is proved, a two-table cascade is proved and emits hardware, and arbitrary networks remain open. The penalty threshold turned out to be published mathematics from 1969.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1010 150)" font-family="Arial,sans-serif">
    <text x="405" y="16" text-anchor="middle" fill="#9aa8b8" font-size="16" letter-spacing="3">HOW FAR THE PROOF REACHES</text>

    <g transform="translate(20 44)">
      <rect width="770" height="76" rx="14" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="24" y="32" fill="#22a89c" font-size="15" letter-spacing="2">RUNG 1 · PROVED</text>
      <text x="24" y="60" fill="#fff" font-size="22">one fully observed look-up table returns to target</text>
      <text x="746" y="50" text-anchor="end" fill="#22a89c" font-size="24" font-weight="700">✓</text>
    </g>

    <g transform="translate(20 136)">
      <rect width="770" height="76" rx="14" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="24" y="32" fill="#22a89c" font-size="15" letter-spacing="2">RUNG 2 · PROVED + EMITS VERILOG</text>
      <text x="24" y="60" fill="#fff" font-size="22">a two-table cascade, all eight inputs</text>
      <text x="746" y="50" text-anchor="end" fill="#22a89c" font-size="24" font-weight="700">✓</text>
    </g>

    <g transform="translate(20 228)">
      <rect width="770" height="76" rx="14" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="10 7"/>
      <text x="24" y="32" fill="#d4833f" font-size="15" letter-spacing="2">RUNG N · OPEN FRONTIER</text>
      <text x="24" y="60" fill="#fff" font-size="22">arbitrary multi-table networks</text>
      <text x="746" y="50" text-anchor="end" fill="#d4833f" font-size="22" font-weight="700">?</text>
    </g>

    <rect x="20" y="332" width="770" height="112" rx="16" fill="#101a2b" stroke="#66758a"/>
    <text x="405" y="362" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="2">THE USEFUL EMBARRASSMENT</text>
    <text x="405" y="394" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">penalty threshold ≈ 3.73 · crossover seen in (2, 4]</text>
    <text x="405" y="426" text-anchor="middle" fill="#d4833f" font-size="19">Already published in 1969. Rediscovered, then credited.</text>

    <text x="405" y="490" text-anchor="middle" fill="#9aa8b8" font-size="20">What is genuinely open: scaling with depth and fan-out.</text>
  </g>
</svg>
