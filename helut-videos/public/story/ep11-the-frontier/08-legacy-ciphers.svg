<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Dual use: the same tool aimed backwards</title>
  <desc id="d">The roadmap lists compiling legacy stream ciphers such as A5/1 and RC4 into circuits and melting their state logic. It is carried as trajectory only, not a claim, until graded and reproducible.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 158)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE MACHINERY DOES NOT CARE WHAT THE CIRCUIT IS FOR</text>

    <g transform="translate(0 44)">
      <rect width="405" height="88" rx="16" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="1">A5/1</text>
      <text x="202" y="58" text-anchor="middle" fill="#fff" font-size="19">early mobile telephony</text>
      <text x="202" y="78" text-anchor="middle" fill="#9aa8b8" font-size="16">1980s</text>
    </g>
    <g transform="translate(425 44)">
      <rect width="405" height="88" rx="16" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="202" y="28" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="1">RC4</text>
      <text x="202" y="58" text-anchor="middle" fill="#fff" font-size="19">early web encryption</text>
      <text x="202" y="78" text-anchor="middle" fill="#9aa8b8" font-size="16">1990s</text>
    </g>

    <path d="M415 132v30" stroke="#66758a" stroke-width="3"/>

    <g transform="translate(0 162)">
      <rect width="830" height="66" rx="14" fill="#142738" stroke="#66758a"/>
      <text x="415" y="28" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">THE SUGGESTION</text>
      <text x="415" y="52" text-anchor="middle" fill="#fff" font-size="18">compile to circuits · melt the internal state logic</text>
    </g>

    <rect x="0" y="248" width="830" height="76" rx="16" fill="#33161b" stroke="#e0574c" stroke-width="3"/>
    <text x="415" y="276" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="2">THE PARENTHESIS IN THE SOURCE</text>
    <text x="415" y="306" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">not a claim until graded and reproducible</text>

    <text x="415" y="378" text-anchor="middle" fill="#d4833f" font-size="19">Which is why it is said in public, not quietly.</text>
  </g>
</svg>
