<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">How every public sentence is filed</title>
  <desc id="d">Four categories: a reproducible claim may be cited, an open hedge keeps its asterisk, a non-implication must be actively prevented, and frontier material is never stated as fact.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 150)" font-family="Arial,sans-serif">
    <text x="415" y="14" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">FOUR BOXES · NOTHING SITS OUTSIDE THEM</text>

    <g transform="translate(0 42)">
      <rect width="830" height="62" rx="12" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="22" y="27" fill="#22a89c" font-size="14" letter-spacing="2">REPRODUCIBLE CLAIM</text>
      <text x="22" y="50" fill="#fff" font-size="18">cite it · someone else can re-run it</text>
    </g>
    <g transform="translate(0 116)">
      <rect width="830" height="62" rx="12" fill="#282235" stroke="#d4833f" stroke-width="2"/>
      <text x="22" y="27" fill="#d4833f" font-size="14" letter-spacing="2">OPEN HEDGE</text>
      <text x="22" y="50" fill="#fff" font-size="18">discuss it · the asterisk travels with it</text>
    </g>
    <g transform="translate(0 190)">
      <rect width="830" height="62" rx="12" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
      <text x="22" y="27" fill="#e0574c" font-size="14" letter-spacing="2">NON-IMPLICATION</text>
      <text x="22" y="50" fill="#fff" font-size="18">actively stop people concluding it</text>
    </g>
    <g transform="translate(0 264)">
      <rect width="830" height="76" rx="12" fill="#101a2b" stroke="#66758a" stroke-width="2" stroke-dasharray="10 7"/>
      <text x="22" y="27" fill="#9aa8b8" font-size="14" letter-spacing="2">FRONTIER</text>
      <text x="22" y="50" fill="#fff" font-size="18">not a claim until it earns a reproduce command</text>
      <text x="22" y="68" fill="#d4833f" font-size="16">never a fact · never a true-or-false question</text>
    </g>

    <text x="415" y="392" text-anchor="middle" fill="#d4833f" font-size="20" font-weight="700">Everything after this scene lives in the fourth box.</text>
  </g>
</svg>
