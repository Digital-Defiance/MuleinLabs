<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">A four-LUT two-bit adder provides a complete 16-row control</title>
  <desc id="desc">Four input bits feed four lookup tables arranged in two logic levels and produce three output bits; all 16 possible assignments fit in an exhaustive comparison.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(974 100)" font-family="Arial, sans-serif">
    <text x="448" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE MICROSCOPE · SMALL ENOUGH TO EXHAUST</text>
    <rect x="0" y="56" width="896" height="674" rx="24" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(28 94)">
      <text x="60" y="20" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">4 INPUTS</text>
      <text x="338" y="20" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">LEVEL 1</text>
      <text x="616" y="20" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">LEVEL 2</text>
      <text x="808" y="20" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">3 OUTPUTS</text>
      <g transform="translate(0 62)">
        <g fill="#142738" stroke="#66758a"><rect width="116" height="52" rx="9"/><rect y="70" width="116" height="52" rx="9"/><rect y="200" width="116" height="52" rx="9"/><rect y="270" width="116" height="52" rx="9"/></g>
        <g fill="#fff" font-family="Courier New, monospace" font-size="19" font-weight="700" text-anchor="middle"><text x="58" y="34">a0</text><text x="58" y="104">b0</text><text x="58" y="234">a1</text><text x="58" y="304">b1</text></g>
        <line x1="116" y1="26" x2="245" y2="66" stroke="#66758a" stroke-width="3"/><line x1="116" y1="96" x2="245" y2="78" stroke="#66758a" stroke-width="3"/>
        <line x1="116" y1="26" x2="245" y2="166" stroke="#66758a" stroke-width="3"/><line x1="116" y1="96" x2="245" y2="178" stroke="#66758a" stroke-width="3"/>
        <rect x="245" y="38" width="176" height="82" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="333" y="72" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">LUT 0</text>
        <text x="333" y="101" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">low SUM · XOR</text>
        <rect x="245" y="138" width="176" height="82" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="333" y="172" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">LUT 1</text>
        <text x="333" y="201" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">low CARRY · AND</text>
        <line x1="421" y1="79" x2="758" y2="79" stroke="#22a89c" stroke-width="3"/>
        <line x1="116" y1="226" x2="523" y2="208" stroke="#66758a" stroke-width="3"/><line x1="116" y1="296" x2="523" y2="224" stroke="#66758a" stroke-width="3"/>
        <line x1="116" y1="226" x2="523" y2="326" stroke="#66758a" stroke-width="3"/><line x1="116" y1="296" x2="523" y2="340" stroke="#66758a" stroke-width="3"/>
        <line x1="421" y1="179" x2="523" y2="236" stroke="#22a89c" stroke-width="3"/>
        <line x1="421" y1="179" x2="523" y2="352" stroke="#22a89c" stroke-width="3"/>
        <rect x="523" y="178" width="184" height="90" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="615" y="212" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">LUT 2</text>
        <text x="615" y="242" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">high SUM</text>
        <rect x="523" y="304" width="184" height="90" rx="15" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="615" y="338" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="1">LUT 3</text>
        <text x="615" y="368" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">high CARRY</text>
        <line x1="707" y1="223" x2="758" y2="223" stroke="#22a89c" stroke-width="3"/><line x1="707" y1="349" x2="758" y2="349" stroke="#22a89c" stroke-width="3"/>
        <g fill="#142738" stroke="#22a89c"><rect x="758" y="53" width="92" height="52" rx="9"/><rect x="758" y="197" width="92" height="52" rx="9"/><rect x="758" y="323" width="92" height="52" rx="9"/></g>
        <g fill="#fff" font-family="Courier New, monospace" font-size="19" font-weight="700" text-anchor="middle"><text x="804" y="87">s0</text><text x="804" y="231">s1</text><text x="804" y="357">c2</text></g>
      </g>
      <g transform="translate(0 486)">
        <rect width="840" height="96" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="28" y="37" fill="#22a89c" font-size="14" letter-spacing="2">COMPLETE FINITE DOMAIN</text>
        <text x="28" y="71" fill="#fff" font-size="23" font-weight="700">2⁴ = 16 input rows · all rows checked</text>
        <text x="812" y="58" text-anchor="end" fill="#9aa8b8" font-size="16">4 LUT · 2 levels · 3 outputs</text>
      </g>
    </g>
  </g>
</svg>
