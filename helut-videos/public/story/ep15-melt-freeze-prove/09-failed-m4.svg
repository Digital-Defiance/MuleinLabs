<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The archived M4 targeted melt is an explicit failed experiment</title>
  <desc id="desc">An orange failure receipt records 925 LUTs, 49 DFFs, 16 mutable and 909 frozen tables, 118 entries still fractional, degraded target fitness, and no post-freeze equivalence receipt; a thresholded artifact is not presented as proof.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(990 106)" font-family="Arial, sans-serif">
    <text x="430" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE FAILURE STAYS IN THE LEDGER</text>
    <rect x="0" y="58" width="860" height="682" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="3"/>
    <g transform="translate(28 88)">
      <rect width="804" height="108" rx="17" fill="#201a22" stroke="#d4833f" stroke-width="2"/>
      <text x="24" y="38" fill="#d4833f" font-size="15" letter-spacing="2">ARCHIVED M4 TARGETED MELT</text>
      <text x="24" y="79" fill="#fff" font-size="32" font-weight="700">FAILURE · DID NOT FREEZE</text>
      <g transform="translate(0 132)">
        <rect width="390" height="110" rx="15" fill="#201a22" stroke="#66758a"/>
        <text x="20" y="34" fill="#9aa8b8" font-size="14" letter-spacing="2">GRAPH</text>
        <text x="20" y="76" fill="#fff" font-size="27" font-weight="700">925 LUT  ·  49 DFF</text>
        <rect x="414" width="390" height="110" rx="15" fill="#201a22" stroke="#66758a"/>
        <text x="434" y="34" fill="#9aa8b8" font-size="14" letter-spacing="2">BLOCK MASK</text>
        <text x="434" y="76" fill="#fff" font-size="25" font-weight="700">16 mutable · 909 frozen</text>
        <rect y="132" width="390" height="128" rx="15" fill="#201a22" stroke="#d4833f" stroke-width="2"/>
        <text x="20" y="166" fill="#d4833f" font-size="14" letter-spacing="2">SQUEEZE RESULT</text>
        <text x="20" y="213" fill="#fff" font-size="35" font-weight="700">118 fractional</text>
        <text x="20" y="241" fill="#9aa8b8" font-size="14">entries remained non-binary</text>
        <rect x="414" y="132" width="390" height="128" rx="15" fill="#201a22" stroke="#d4833f" stroke-width="2"/>
        <text x="434" y="166" fill="#d4833f" font-size="14" letter-spacing="2">TARGET RESULT</text>
        <text x="434" y="213" fill="#fff" font-size="31" font-weight="700">fitness degraded</text>
        <text x="434" y="241" fill="#9aa8b8" font-size="14">worse after the squeeze phase</text>
      </g>
      <g transform="translate(0 418)">
        <rect width="804" height="86" rx="14" fill="#091522" stroke="#d4833f" stroke-width="2"/>
        <text x="22" y="32" fill="#d4833f" font-size="14" letter-spacing="2">EQUIVALENCE RECEIPT</text>
        <text x="782" y="55" text-anchor="end" fill="#fff" font-size="23" font-weight="700">NONE</text>
        <text x="22" y="63" fill="#9aa8b8" font-size="14">no post-freeze proof that thresholded Verilog was correct</text>
        <rect y="108" width="804" height="98" rx="14" fill="#091522"/>
        <text x="402" y="143" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">ARTIFACT ≠ RECEIPT</text>
        <text x="402" y="178" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">a written thresholded file does not turn this run into a pass</text>
      </g>
    </g>
  </g>
</svg>
