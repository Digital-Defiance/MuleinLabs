<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Binary INIT values melt into continuous parameters, freeze back to bits, then require independent proof</title>
  <desc id="desc">A right-side four-stage diagram moves from binary truth-table entries through continuous values and a binary freeze proposal to an independent proof gate; a dashed final link warns that the optimized elite is not yet connected to the round-trip checker.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(980 150)" font-family="Arial, sans-serif">
    <text x="440" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">CONTINUOUS VALUES ARE NOT THE FINISH LINE</text>
    <rect x="0" y="58" width="880" height="516" rx="24" fill="#0c1724" stroke="#66758a" stroke-width="2"/>
    <g transform="translate(26 128)">
      <rect width="178" height="224" rx="20" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="89" y="36" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="2">BINARY INIT</text>
      <g transform="translate(42 62)" font-family="Courier New, monospace" font-size="18" text-anchor="middle">
        <g fill="#142738" stroke="#66758a"><rect width="42" height="42" rx="5"/><rect x="52" width="42" height="42" rx="5"/><rect y="52" width="42" height="42" rx="5"/><rect x="52" y="52" width="42" height="42" rx="5"/></g>
        <g fill="#fff"><text x="21" y="28">0</text><text x="73" y="28">1</text><text x="21" y="80">1</text><text x="73" y="80">0</text></g>
      </g>
      <text x="89" y="189" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">EXACT BITS</text>
      <line x1="178" y1="112" x2="214" y2="112" stroke="#66758a" stroke-width="3"/>
      <polygon points="226,112 209,103 209,121" fill="#66758a"/>
      <rect x="226" width="178" height="224" rx="20" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="315" y="36" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="2">MELT</text>
      <g transform="translate(250 62)" font-family="Courier New, monospace" font-size="15" text-anchor="middle">
        <g fill="#201a22" stroke="#d4833f"><rect width="58" height="42" rx="5"/><rect x="68" width="58" height="42" rx="5"/><rect y="52" width="58" height="42" rx="5"/><rect x="68" y="52" width="58" height="42" rx="5"/></g>
        <g fill="#fff"><text x="29" y="27">.08</text><text x="97" y="27">.91</text><text x="29" y="79">.50</text><text x="97" y="79">.37</text></g>
      </g>
      <text x="315" y="189" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">CONTINUOUS</text>
      <line x1="404" y1="112" x2="440" y2="112" stroke="#66758a" stroke-width="3"/>
      <polygon points="452,112 435,103 435,121" fill="#66758a"/>
      <rect x="452" width="178" height="224" rx="20" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="541" y="36" text-anchor="middle" fill="#22a89c" font-size="13" letter-spacing="2">FREEZE PROPOSAL</text>
      <g transform="translate(494 62)" font-family="Courier New, monospace" font-size="18" text-anchor="middle">
        <g fill="#142738" stroke="#66758a"><rect width="42" height="42" rx="5"/><rect x="52" width="42" height="42" rx="5"/><rect y="52" width="42" height="42" rx="5"/><rect x="52" y="52" width="42" height="42" rx="5"/></g>
        <g fill="#fff"><text x="21" y="28">0</text><text x="73" y="28">1</text><text x="21" y="80">1</text><text x="73" y="80">0</text></g>
      </g>
      <text x="541" y="189" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">BITS AGAIN</text>
      <line x1="630" y1="112" x2="666" y2="112" stroke="#d4833f" stroke-width="3" stroke-dasharray="7 6"/>
      <polygon points="678,112 661,103 661,121" fill="#d4833f"/>
      <rect x="678" width="150" height="224" rx="20" fill="#2b2025" stroke="#d4833f" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="753" y="36" text-anchor="middle" fill="#d4833f" font-size="13" letter-spacing="2">REQUIRED GATE</text>
      <path d="M713 72 L753 52 L793 72 V115 C793 145 769 161 753 170 C737 161 713 145 713 115 Z" fill="#091522" stroke="#d4833f" stroke-width="2"/>
      <text x="753" y="124" text-anchor="middle" fill="#d4833f" font-size="32" font-weight="700">?</text>
      <text x="753" y="197" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">PROVE</text>
    </g>
    <g transform="translate(26 390)">
      <rect width="828" height="128" rx="16" fill="#2b2025" stroke="#d4833f"/>
      <text x="414" y="37" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">CURRENT MISSING LINK</text>
      <text x="414" y="75" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">optimized elite → emit → Yosys → exhaustive check</text>
      <text x="414" y="104" text-anchor="middle" fill="#9aa8b8" font-size="15">the sequence is the contract—not a completed receipt</text>
    </g>
  </g>
</svg>
