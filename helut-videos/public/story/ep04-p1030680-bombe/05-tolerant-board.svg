<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mulein deletion-tolerant board</title>
  <desc id="desc">An exact menu contradiction is retried after deleting one recorded edge before closure, producing a repair candidate with provenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#152834"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#22a89c"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g transform="translate(1080 305)" font-family="Arial, sans-serif">
    <g>
      <rect width="730" height="205" rx="24" fill="#151d2d" stroke="#d4833f" stroke-width="2"/>
      <text x="30" y="44" fill="#d4833f" font-size="18" letter-spacing="3">PASS 1 · EXACT FIRST</text>
      <g transform="translate(55 80)" stroke="#9aa8b8" stroke-width="4" fill="#172f3b"><circle cx="0" cy="34" r="20"/><circle cx="120" cy="0" r="20"/><circle cx="235" cy="45" r="20"/><circle cx="350" cy="8" r="20"/><circle cx="470" cy="45" r="20"/><path d="M20 28L100 6M140 7l75 31M255 39l75-25M370 14l80 25"/></g>
      <g transform="translate(585 74)"><circle cx="44" cy="44" r="44" fill="#3a1a22" stroke="#d4833f" stroke-width="3"/><path d="M22 22l44 44M66 22L22 66" stroke="#d4833f" stroke-width="8" stroke-linecap="round"/><text x="44" y="116" text-anchor="middle" fill="#d4833f" font-size="18">contradiction</text></g>
    </g>
    <path d="M365 220v74" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(0 315)">
      <rect width="730" height="270" rx="24" fill="#112a32" stroke="#22a89c" stroke-width="3"/>
      <text x="30" y="44" fill="#22a89c" font-size="18" letter-spacing="3">PASS 2 · MINIMAL DELETION SET</text>
      <g transform="translate(55 90)" stroke="#9aa8b8" stroke-width="4" fill="#173d3c"><circle cx="0" cy="34" r="20"/><circle cx="120" cy="0" r="20"/><circle cx="235" cy="45" r="20"/><circle cx="350" cy="8" r="20"/><circle cx="470" cy="45" r="20"/><path d="M20 28L100 6M140 7l75 31M370 14l80 25"/><path d="M255 39l75-25" stroke="#d4833f" stroke-dasharray="8 9" opacity="0.55"/><path d="M286 4l22 22M308 4l-22 22" stroke="#d4833f" stroke-width="6"/></g>
      <g transform="translate(570 84)"><circle cx="55" cy="55" r="54" fill="#123a38" stroke="#22a89c" stroke-width="3"/><path d="M28 56l18 20 37-45" fill="none" stroke="#22a89c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="142" text-anchor="middle" fill="#22a89c" font-size="20">repair candidate</text></g>
      <g transform="translate(30 205)" fill="#9aa8b8" font-size="18"><text x="0" y="0">✓ seed still attached</text><text x="220" y="0">✓ at most 10 pairs</text><text x="445" y="0">✓ dropped edge recorded</text></g>
    </g>
  </g>
  <g transform="translate(1040 925)" font-family="Arial, sans-serif"><text fill="#f4f6f8" font-size="23" font-weight="700">Control sensitivity:</text><text x="222" fill="#9aa8b8" font-size="23">1–3 corrupt crib letters · 25/25 deductions preserved</text></g>
</svg>
