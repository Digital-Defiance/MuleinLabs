<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Historical Enigma attack context</title><desc id="d">A timeline credits Polish cryptanalysis, Turing and Welchman, operators and captured material, then shows a crib as one constraint source.</desc><rect width="1920" height="1080" fill="#0a1422"/><g transform="translate(1030 170)" font-family="Arial,sans-serif"><path d="M110 75v575" stroke="#66758a" stroke-width="5"/><g><circle cx="110" cy="75" r="17" fill="#22a89c"/><text x="155" y="65" fill="#22a89c" font-size="17" letter-spacing="2">FOUNDATION</text><text x="155" y="100" fill="#fff" font-size="27" font-weight="700">Polish cryptanalysis</text></g><g transform="translate(0 145)"><circle cx="110" cy="75" r="17" fill="#d4833f"/><text x="155" y="65" fill="#d4833f" font-size="17" letter-spacing="2">EXTENSION</text><text x="155" y="100" fill="#fff" font-size="27" font-weight="700">Turing · Welchman · Bombe</text></g><g transform="translate(0 290)"><circle cx="110" cy="75" r="17" fill="#22a89c"/><text x="155" y="65" fill="#22a89c" font-size="17" letter-spacing="2">OPERATIONS</text><text x="155" y="100" fill="#fff" font-size="27" font-weight="700">Operators · procedures · captured material</text></g><g transform="translate(0 435)"><circle cx="110" cy="75" r="17" fill="#d4833f"/><text x="155" y="65" fill="#d4833f" font-size="17" letter-spacing="2">ONE POWERFUL INPUT</text><text x="155" y="100" fill="#fff" font-size="27" font-weight="700">Crib = plausible aligned plaintext</text></g><rect x="30" y="665" width="840" height="115" rx="22" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="450" y="709" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">P1030680 · 72 LETTERS</text><text x="450" y="748" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">No verified crib → target-specific information deficit</text><text x="450" y="772" text-anchor="middle" fill="#9aa8b8" font-size="16">Not a theorem that Enigma without cribs is unbreakable</text></g></svg>