<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Candidate replay is the next action</title>
  <desc id="desc">Two narrow replay queues lead toward evidence while a broad repeated stripe is paused; an open search-space grid remains behind them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#132936"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#9aa8b8" stroke-opacity="0.12"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#22a89c"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="1100" y="245" width="780" height="620" rx="30" fill="url(#grid)" stroke="#33445a"/>
  <g transform="translate(1150 305)" font-family="Arial, sans-serif">
    <text fill="#9aa8b8" font-size="18" letter-spacing="3">NEXT INFORMATION-GAIN ACTION</text>
    <g transform="translate(0 55)">
      <rect width="260" height="150" rx="20" fill="#162535" stroke="#d4833f" stroke-width="2"/>
      <text x="24" y="40" fill="#d4833f" font-size="16" letter-spacing="2">QUEUE A</text>
      <text x="24" y="88" fill="#f4f6f8" font-size="39" font-weight="700">41 exact</text>
      <text x="24" y="121" fill="#9aa8b8" font-size="20">post-gap hits</text>
      <path d="M280 75h105" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
      <rect x="405" width="285" height="150" rx="20" fill="#123532" stroke="#22a89c" stroke-width="2"/>
      <text x="429" y="52" fill="#f4f6f8" font-size="25" font-weight="700">geometry-aware</text>
      <text x="429" y="87" fill="#f4f6f8" font-size="25" font-weight="700">full-message replay</text>
      <text x="429" y="121" fill="#9aa8b8" font-size="19">preserve the gap</text>
    </g>
    <g transform="translate(0 245)">
      <rect width="260" height="150" rx="20" fill="#162535" stroke="#d4833f" stroke-width="2"/>
      <text x="24" y="40" fill="#d4833f" font-size="16" letter-spacing="2">QUEUE B</text>
      <text x="24" y="88" fill="#f4f6f8" font-size="32" font-weight="700">best repairs</text>
      <text x="24" y="121" fill="#9aa8b8" font-size="20">deduplicate first</text>
      <path d="M280 75h105" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
      <rect x="405" width="285" height="150" rx="20" fill="#123532" stroke="#22a89c" stroke-width="2"/>
      <text x="429" y="52" fill="#f4f6f8" font-size="25" font-weight="700">explicit corrected-</text>
      <text x="429" y="87" fill="#f4f6f8" font-size="25" font-weight="700">letter replay</text>
      <text x="429" y="121" fill="#9aa8b8" font-size="19">no invented adjacency</text>
    </g>
    <g transform="translate(0 445)">
      <rect width="690" height="92" rx="18" fill="#2b1c24" stroke="#d4833f"/>
      <path d="M30 26l38 38M68 26L30 64" stroke="#d4833f" stroke-width="7" stroke-linecap="round"/>
      <text x="94" y="43" fill="#f4f6f8" font-size="23" font-weight="700">PAUSE: another same-shape broad stripe</text>
      <text x="94" y="72" fill="#9aa8b8" font-size="19">more than 82% paired as translated identity states</text>
    </g>
  </g>
</svg>
