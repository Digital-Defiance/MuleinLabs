<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mulein Future-bank architecture</title>
  <desc id="desc">A stable manifest drives a shared M4 trail, four parallel Future lanes, compact receipts, host replay, and a fail-closed BREAK gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#0d2c32"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#22a89c"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g transform="translate(85 430)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <g><rect width="270" height="245" rx="24" fill="#151f31" stroke="#d4833f" stroke-width="2"/><text x="26" y="42" fill="#d4833f" font-size="17" letter-spacing="3">STABLE MANIFEST</text><text x="26" y="95" fill="#f4f6f8" font-size="43" font-weight="700">628</text><text x="26" y="128" fill="#f4f6f8" font-size="24">Futures</text><line x1="26" y1="150" x2="244" y2="150" stroke="#33445a"/><text x="26" y="184" fill="#9aa8b8" font-size="20">314 identity</text><text x="26" y="215" fill="#9aa8b8" font-size="20">314 post-gap δ=4</text></g>
    <path d="M290 122h88" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(398)"><rect width="300" height="245" rx="24" fill="#102a35" stroke="#22a89c" stroke-width="3"/><text x="28" y="42" fill="#22a89c" font-size="17" letter-spacing="3">SHARED ONCE</text><text x="28" y="93" fill="#f4f6f8" font-size="31" font-weight="700">M4 trail</text><text x="28" y="130" fill="#f4f6f8" font-size="25">80 steps × 26 letters</text><g transform="translate(30 164)" fill="#22a89c"><rect width="34" height="44" rx="5"/><rect x="47" width="34" height="44" rx="5" opacity="0.85"/><rect x="94" width="34" height="44" rx="5" opacity="0.7"/><rect x="141" width="34" height="44" rx="5" opacity="0.55"/><rect x="188" width="34" height="44" rx="5" opacity="0.4"/></g></g>
    <path d="M718 122h72" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(810)"><rect width="310" height="245" rx="24" fill="#151f31" stroke="#33445a" stroke-width="2"/><text x="28" y="42" fill="#d4833f" font-size="17" letter-spacing="3">PARALLEL BANK</text><text x="28" y="83" fill="#f4f6f8" font-size="27" font-weight="700">4 Future lanes</text><g transform="translate(28 108)" font-size="18"><rect width="254" height="25" rx="6" fill="#123a38"/><rect y="35" width="254" height="25" rx="6" fill="#123a38"/><rect y="70" width="254" height="25" rx="6" fill="#123a38"/><rect y="105" width="254" height="25" rx="6" fill="#123a38"/><text x="12" y="19" fill="#f4f6f8">closure · completion</text><text x="12" y="54" fill="#f4f6f8">closure · completion</text><text x="12" y="89" fill="#f4f6f8">closure · completion</text><text x="12" y="124" fill="#f4f6f8">closure · completion</text></g></g>
    <path d="M1140 122h70" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1230)"><rect width="235" height="245" rx="24" fill="#151f31" stroke="#33445a" stroke-width="2"/><text x="25" y="42" fill="#d4833f" font-size="17" letter-spacing="3">DURABLE</text><text x="25" y="92" fill="#f4f6f8" font-size="29" font-weight="700">receipts</text><text x="25" y="128" fill="#9aa8b8" font-size="20">protocol-v3 JSONL</text><text x="25" y="162" fill="#9aa8b8" font-size="20">ordered · synced</text><text x="25" y="196" fill="#9aa8b8" font-size="20">duplicate-rejecting</text></g>
    <path d="M1485 122h62" stroke="#22a89c" stroke-width="5" marker-end="url(#arrow)"/>
