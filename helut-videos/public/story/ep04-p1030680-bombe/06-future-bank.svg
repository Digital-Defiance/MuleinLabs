  </g>
  <text x="90" y="745" fill="#9aa8b8" font-family="Arial, sans-serif" font-size="23">Source RTL → post-Yosys RTL → clear JSON → Metal TensorLUT · known-control parity</text>
  <rect x="90" y="790" width="905" height="58" rx="12" fill="#221b22" stroke="#d4833f"/><text x="118" y="827" fill="#f4f6f8" font-family="Arial, sans-serif" font-size="23"><tspan fill="#d4833f" font-weight="700">CLEAR PATH:</tspan> Float TensorLUT / Metal · not FHE · not encrypted tick rate</text>
</svg>
