<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Long-lived algorithm lineage thought experiment</title><desc id="d">A broken past profile cannot repair old traffic, but its disclosed weakness can inform a separately versioned future profile.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1060 185) scale(.82)" font-family="Arial,sans-serif"><g transform="translate(15 90)"><rect width="290" height="310" rx="28" fill="#321b23" stroke="#d4833f" stroke-width="3"/><text x="145" y="50" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">PAST PROFILE</text><path d="M82 100l126 126M208 100L82 226" stroke="#d4833f" stroke-width="10"/><text x="145" y="270" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">weakness disclosed</text></g><path d="M305 245h180" stroke="#d4833f" stroke-width="6"/><path d="M468 226l30 19-30 19" fill="#d4833f"/><rect x="325" y="120" width="155" height="74" rx="16" fill="#2b2025" stroke="#d4833f"/><text x="402" y="149" text-anchor="middle" fill="#d4833f" font-size="15">EVIDENCE</text><text x="402" y="176" text-anchor="middle" fill="#fff" font-size="18">not erasure</text><g transform="translate(500 90)"><rect width="290" height="310" rx="28" fill="#282235" stroke="#d4833f" stroke-width="3"/><text x="145" y="50" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">OFFLINE REVIEW</text><text x="145" y="112" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">new construction</text><text x="145" y="155" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">new compatibility ID</text><text x="145" y="198" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">new attack budget</text><text x="145" y="260" text-anchor="middle" fill="#9aa8b8" font-size="18">promotion may fail</text></g><path d="M790 245h180" stroke="#22a89c" stroke-width="6"/><path d="M953 226l30 19-30 19" fill="#22a89c"/><g transform="translate(790 455)"><rect x="-130" y="0" width="330" height="120" rx="22" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="35" y="45" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">FUTURE PROFILE</text><text x="35" y="82" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">better tested—not immortal</text></g><path d="M160 430v205h665V575" fill="none" stroke="#66758a" stroke-width="3" stroke-dasharray="9 8"/><text x="490" y="680" text-anchor="middle" fill="#d4833f" font-size="22" font-weight="700">A COMPROMISED MESSAGE CANNOT BE UNSENT.</text><text x="490" y="720" text-anchor="middle" fill="#9aa8b8" font-size="19">The lineage may be long-lived. No algorithm is promised to “never die.”</text></g></svg>