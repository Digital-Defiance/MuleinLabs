<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 v1 autopsy</title><desc id="d">Thirty-five passing tests are contrasted with a state-rank collapse, zero locks, and a correlated nonlinear formula.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1010 180) scale(.88)" font-family="Arial,sans-serif"><rect x="25" width="920" height="115" rx="24" fill="#142738" stroke="#22a89c" stroke-width="2"/><text x="485" y="46" text-anchor="middle" fill="#22a89c" font-size="18" letter-spacing="2">WHAT THE OLD SUITE SAW</text><text x="485" y="84" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">35 / 35 PASS</text><path d="M485 115v70" stroke="#d4833f" stroke-width="6"/><path d="M470 170l15 24 15-24" fill="#d4833f"/><text x="485" y="235" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">WHAT THE AUTOPSY FOUND</text><g transform="translate(0 270)"><rect width="300" height="280" rx="26" fill="#321b23" stroke="#d4833f" stroke-width="2"/><text x="150" y="48" text-anchor="middle" fill="#d4833f" font-size="17">STATE RANK</text><text x="150" y="112" text-anchor="middle" fill="#fff" font-size="52" font-weight="700">64 → 5</text><text x="150" y="150" text-anchor="middle" fill="#9aa8b8" font-size="19">after 59 clocks</text><path d="M55 205h190" stroke="#66758a" stroke-width="10"/><path d="M55 205h24" stroke="#d4833f" stroke-width="10"/></g><g transform="translate(335 270)"><rect width="300" height="280" rx="26" fill="#321b23" stroke="#d4833f" stroke-width="2"/><text x="150" y="48" text-anchor="middle" fill="#d4833f" font-size="17">ZERO LOCK</text><text x="150" y="112" text-anchor="middle" fill="#fff" font-size="52" font-weight="700">≈ 1 / 32</text><text x="150" y="150" text-anchor="middle" fill="#9aa8b8" font-size="19">sampled seeds</text><circle cx="150" cy="215" r="32" fill="none" stroke="#d4833f" stroke-width="5"/><path d="M128 193l44 44M172 193l-44 44" stroke="#d4833f" stroke-width="5"/></g><g transform="translate(670 270)"><rect width="300" height="280" rx="26" fill="#321b23" stroke="#d4833f" stroke-width="2"/><text x="150" y="48" text-anchor="middle" fill="#d4833f" font-size="17">FORMULA LEAK</text><text x="150" y="112" text-anchor="middle" fill="#fff" font-size="46" font-weight="700">0.375</text><text x="150" y="150" text-anchor="middle" fill="#9aa8b8" font-size="19">normalized correlation</text><path d="M70 225l45-35 35 18 75-65" fill="none" stroke="#d4833f" stroke-width="5"/></g><rect x="125" y="605" width="720" height="100" rx="20" fill="#2b2025" stroke="#d4833f"/><text x="485" y="645" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Implementations agreed on a broken invariant.</text><text x="485" y="678" text-anchor="middle" fill="#9aa8b8" font-size="18">All v1 grades remain quarantined.</text></g></svg>