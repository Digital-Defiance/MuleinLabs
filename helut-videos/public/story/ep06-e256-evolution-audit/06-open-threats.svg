<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Open E256 threat board</title><desc id="d">Five columns show open construction, protocol, software, RTL, and physical-security work.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(995 190) scale(.9)" font-family="Arial,sans-serif"><g font-size="17" text-anchor="middle"><g><rect width="180" height="440" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="90" y="46" fill="#d4833f" letter-spacing="1">CONSTRUCTION</text><text x="90" y="105" fill="#fff" font-size="23" font-weight="700">OPEN</text><text x="90" y="165" fill="#9aa8b8">human acceptance</text><text x="90" y="200" fill="#9aa8b8">attack matrix</text><text x="90" y="235" fill="#9aa8b8">profile binding</text></g><g transform="translate(200)"><rect width="180" height="440" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="90" y="46" fill="#d4833f" letter-spacing="1">PROTOCOL</text><text x="90" y="105" fill="#fff" font-size="23" font-weight="700">OPEN</text><text x="90" y="165" fill="#9aa8b8">authentication</text><text x="90" y="200" fill="#9aa8b8">replay</text><text x="90" y="235" fill="#9aa8b8">trust binding</text></g><g transform="translate(400)"><rect width="180" height="440" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="90" y="46" fill="#d4833f" letter-spacing="1">SOFTWARE</text><text x="90" y="105" fill="#fff" font-size="23" font-weight="700">OPEN</text><text x="90" y="165" fill="#9aa8b8">parsers</text><text x="90" y="200" fill="#9aa8b8">lifecycle</text><text x="90" y="235" fill="#9aa8b8">zeroization</text></g><g transform="translate(600)"><rect width="180" height="440" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="90" y="46" fill="#d4833f" letter-spacing="1">RTL</text><text x="90" y="105" fill="#fff" font-size="23" font-weight="700">OPEN</text><text x="90" y="165" fill="#9aa8b8">bus joining</text><text x="90" y="200" fill="#9aa8b8">table loader</text><text x="90" y="235" fill="#9aa8b8">fault handling</text></g><g transform="translate(800)"><rect width="180" height="440" rx="24" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="90" y="46" fill="#d4833f" letter-spacing="1">PHYSICAL</text><text x="90" y="105" fill="#fff" font-size="23" font-weight="700">OPEN</text><text x="90" y="165" fill="#9aa8b8">side channels</text><text x="90" y="200" fill="#9aa8b8">faults</text><text x="90" y="235" fill="#9aa8b8">real hardware</text></g></g><rect x="115" y="500" width="750" height="110" rx="22" fill="#321b23" stroke="#d4833f" stroke-width="3"/><text x="490" y="542" text-anchor="middle" fill="#d4833f" font-size="18" letter-spacing="2">EXPERIMENTAL LABORATORY</text><text x="490" y="580" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Timing jitter is not side-channel protection.</text><text x="490" y="660" text-anchor="middle" fill="#9aa8b8" font-size="19">Standard authenticated encryption remains mandatory for real data.</text></g></svg>