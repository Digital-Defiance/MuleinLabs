ze="23" font-weight="700">security proof</text></g><path d="M755 25v610" stroke="#d4833f" stroke-width="4"/><text x="790" y="330" fill="#d4833f" font-size="22" font-weight="700" transform="rotate(90 790 330)">PARITY IS NOT SECURITY</text></g></svg>