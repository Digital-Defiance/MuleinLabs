<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">E256 evolution ledger</title><desc id="d">A versioned lineage preserves quarantined failures and advances through an explicit human promotion gate rather than mutating at runtime.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1040 190) scale(.86)" font-family="Arial,sans-serif"><path d="M100 330h800" stroke="#66758a" stroke-width="6"/><g text-anchor="middle"><g transform="translate(100 330)"><circle r="62" fill="#321b23" stroke="#d4833f" stroke-width="3"/><text y="-5" fill="#fff" font-size="23" font-weight="700">v1</text><text y="25" fill="#d4833f" font-size="15">quarantined</text></g><g transform="translate(360 330)"><circle r="62" fill="#142738" stroke="#22a89c" stroke-width="3"/><text y="-5" fill="#fff" font-size="23" font-weight="700">v2</text><text y="25" fill="#22a89c" font-size="15">fixture-v4 live</text></g><g transform="translate(620 330)"><circle r="62" fill="#282235" stroke="#d4833f" stroke-width="3" stroke-dasharray="8 7"/><text y="-5" fill="#fff" font-size="23" font-weight="700">v3</text><text y="25" fill="#d4833f" font-size="15">fixture-v5 staging</text></g><g transform="translate(880 330)"><rect x="-85" y="-65" width="170" height="130" rx="22" fill="#171c29" stroke="#66758a" stroke-width="3"/><text y="-8" fill="#fff" font-size="22" font-weight="700">future</text><text y="24" fill="#9aa8b8" font-size="15">may be rejected</text></g></g><path d="M680 165h180v90" fill="none" stroke="#d4833f" stroke-width="4"/><rect x="500" y="70" width="360" height="95" rx="20" fill="#2b2025" stroke="#d4833f"/><text x="680" y="109" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">EXPLICIT HUMAN GATE</text><text x="680" y="142" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">promotion—not mutation</text><rect x="125" y="500" width="750" height="120" rx="22" fill="#14202f" stroke="#66758a"/><text x="500" y="545" text-anchor="middle" fill="#22a89c" font-size="18" letter-spacing="2">THE LEDGER EVOLVES</text><text x="500" y="585" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Failures stay visible · live profile stays immutable</text><path d="M365 650h270" stroke="#d4833f" stroke-width="8"/><path d="M490 635v30" stroke="#d4833f" stroke-width="8"/><text x="500" y="710" text-anchor="middle" fill="#d4833f" font-size="18">NO RUNTIME MUTATION</text></g></svg>