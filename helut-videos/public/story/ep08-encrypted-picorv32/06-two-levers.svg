<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The two levers that moved the cost</title>
  <desc id="d">Re-synthesizing to six-input tables cut the table count by 58 percent, and a concurrent wavefront schedule with identity and constant skipping gave about an eight-fold speed-up.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1005 170)" font-family="Arial,sans-serif">
    <text x="410" y="16" text-anchor="middle" fill="#9aa8b8" font-size="16" letter-spacing="3">NOT PARAMETER TUNING</text>

    <g transform="translate(20 46)">
      <rect width="780" height="106" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="24" y="32" fill="#22a89c" font-size="15" letter-spacing="2">LEVER 1 · FEWER TABLES</text>
      <text x="24" y="70" fill="#fff" font-size="26" font-weight="700">4,785 → 2,006</text>
      <text x="24" y="94" fill="#9aa8b8" font-size="18">re-synthesize to 6-input tables</text>
      <text x="756" y="76" text-anchor="end" fill="#22a89c" font-size="30" font-weight="700">−58%</text>
    </g>

    <g transform="translate(20 178)">
      <rect width="780" height="106" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="24" y="32" fill="#22a89c" font-size="15" letter-spacing="2">LEVER 2 · SMARTER SCHEDULE</text>
      <text x="24" y="70" fill="#fff" font-size="26" font-weight="700">1.35 s → 0.165 s</text>
      <text x="24" y="94" fill="#9aa8b8" font-size="18">concurrent wavefront · skip identity and constant</text>
      <text x="756" y="76" text-anchor="end" fill="#22a89c" font-size="30" font-weight="700">≈8×</text>
    </g>

    <rect x="20" y="310" width="780" height="66" rx="14" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
    <text x="410" y="338" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">SIDE EFFECT</text>
    <text x="410" y="365" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">7 older timing rows became stale — too pessimistic</text>

    <text x="410" y="428" text-anchor="middle" fill="#9aa8b8" font-size="20">Engineering, not cryptography, unlocked production size.</text>
  </g>
</svg>
