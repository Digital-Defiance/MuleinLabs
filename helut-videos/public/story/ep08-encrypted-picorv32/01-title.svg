<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">A processor running under encryption</title>
  <desc id="d">Encrypted instruction and data enter a circuit-shaped processor; the circuit advances state and produces encrypted results without the value ever appearing in the clear.</desc>
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#16323d"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg8)"/>
  <g transform="translate(1010 175)" font-family="Arial,sans-serif">
    <text x="405" y="16" text-anchor="middle" fill="#9aa8b8" font-size="16" letter-spacing="3">A PROCESSOR IS JUST A CIRCUIT</text>

    <rect x="20" y="46" width="240" height="74" rx="14" fill="#142738" stroke="#22a89c" stroke-width="2"/>
    <text x="140" y="74" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="1">ENCRYPTED IN</text>
    <text x="140" y="102" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">instruction · data</text>

    <path d="M262 83h58" stroke="#22a89c" stroke-width="3"/>

    <rect x="322" y="34" width="240" height="98" rx="16" fill="#1b2637" stroke="#d4833f" stroke-width="3"/>
    <text x="442" y="64" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">RISC-V CORE</text>
    <text x="442" y="94" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">2,006 tables</text>
    <text x="442" y="118" text-anchor="middle" fill="#9aa8b8" font-size="17">1,565 flip-flops</text>

    <path d="M564 83h58" stroke="#22a89c" stroke-width="3"/>

    <rect x="624" y="46" width="166" height="74" rx="14" fill="#142738" stroke="#22a89c" stroke-width="2"/>
    <text x="707" y="74" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="1">ENCRYPTED OUT</text>
    <text x="707" y="102" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">result</text>

    <path d="M442 132v34" stroke="#66758a" stroke-width="3"/>
    <rect x="242" y="166" width="400" height="62" rx="14" fill="#101a2b" stroke="#66758a"/>
    <text x="442" y="192" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="2">STATE CARRIES TO THE NEXT TICK</text>
    <text x="442" y="217" text-anchor="middle" fill="#fff" font-size="19">the encrypted circuit has memory</text>

    <rect x="20" y="264" width="770" height="66" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
    <text x="405" y="292" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">NEVER IN THE CLEAR</text>
    <text x="405" y="319" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">store a value · load it back · never decrypt it</text>

    <text x="405" y="382" text-anchor="middle" fill="#d4833f" font-size="20">Functional evidence, not a production CPU.</text>
  </g>
</svg>
