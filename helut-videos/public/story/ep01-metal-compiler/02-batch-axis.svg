<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Batch axis diagram</title><desc id="d">Independent circuit states enter separate rows of one compiled graph and leave without sharing state.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1010 220)" font-family="Arial,sans-serif"><text x="130" y="25" text-anchor="middle" fill="#9aa8b8" font-size="17" letter-spacing="2">INDEPENDENT STATES</text><g fill="#142738" stroke="#22a89c"><rect x="20" y="55" width="220" height="70" rx="14"/><rect x="20" y="155" width="220" height="70" rx="14"/><rect x="20" y="255" width="220" height="70" rx="14"/><rect x="20" y="355" width="220" height="70" rx="14"/></g><g fill="#fff" font-size="22"><text x="130" y="99" text-anchor="middle">state B₀</text><text x="130" y="199" text-anchor="middle">state B₁</text><text x="130" y="299" text-anchor="middle">state B₂</text><text x="130" y="399" text-anchor="middle">state Bₙ</text></g><path d="M240 90h110M240 190h110M240 290h110M240 390h110" stroke="#22a89c" stroke-width="4"/><rect x="350" y="45" width="340" height="390" rx="28" fill="#282235" stroke="#d4833f" stroke-width="3"/><text x="520" y="100" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">ONE COMPILED GRAPH</text><text x="520" y="180" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">same circuit</text><text x="520" y="225" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">same schedule</text><path d="M405 280h230" stroke="#66758a" stroke-width="2" stroke-dasharray="8 8"/><text x="520" y="340" text-anchor="middle" fill="#22a89c" font-size="25" font-weight="700">no shared state</text><path d="M690 90h145M690 190h145M690 290h145M690 390h145" stroke="#d4833f" stroke-width="4"/><text x="835" y="99" fill="#9aa8b8" font-size="20">result 0</text><text x="835" y="199" fill="#9aa8b8" font-size="20">result 1</text><text x="835" y="299" fill="#9aa8b8" font-size="20">result 2</text><text x="835" y="399" fill="#9aa8b8" font-size="20">result n</text><rect x="130" y="500" width="710" height="90" rx="18" fill="#101a2b" stroke="#66758a"/><text x="485" y="538" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">37.4M settings/s on the blind cleartext control</text><text x="485" y="570" text-anchor="middle" fill="#d4833f" font-size="18">NOT ENCRYPTED THROUGHPUT</text></g></svg>