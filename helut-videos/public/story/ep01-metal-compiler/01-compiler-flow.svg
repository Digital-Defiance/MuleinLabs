<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">HELUT compiler flow</title><desc id="d">Five stages run from Yosys JSON through supported cells, dependency waves, MPS Graph construction, and sequential ticking.</desc><rect width="1920" height="1080" fill="#091522"/><g transform="translate(1080 150)" font-family="Arial,sans-serif"><path d="M320 90v650" stroke="#334a5b" stroke-width="7"/><g fill="#142738" stroke-width="2"><rect x="40" width="560" height="115" rx="22" stroke="#22a89c"/><rect x="40" y="145" width="560" height="115" rx="22" stroke="#66758a"/><rect x="40" y="290" width="560" height="115" rx="22" fill="#282235" stroke="#d4833f"/><rect x="40" y="435" width="560" height="115" rx="22" stroke="#22a89c"/><rect x="40" y="580" width="560" height="115" rx="22" fill="#2b2025" stroke="#d4833f"/></g><g font-size="16" letter-spacing="2"><text x="75" y="38" fill="#22a89c">01 · PARSE</text><text x="75" y="183" fill="#9aa8b8">02 · VALIDATE</text><text x="75" y="328" fill="#d4833f">03 · SCHEDULE</text><text x="75" y="473" fill="#22a89c">04 · BUILD ONCE</text><text x="75" y="618" fill="#d4833f">05 · TICK</text></g><g fill="#fff" font-size="29" font-weight="700"><text x="75" y="79">Yosys JSON netlist</text><text x="75" y="224">Supported LUT + DFF cells</text><text x="75" y="369">Dependency wavefronts</text><text x="75" y="514">Metal Performance Shaders Graph</text><text x="75" y="659">Input → graph → next state</text></g><g fill="#22a89c"><path d="M308 117h24l-12 20z"/><path d="M308 262h24l-12 20z"/><path d="M308 407h24l-12 20z"/><path d="M308 552h24l-12 20z"/></g></g></svg>