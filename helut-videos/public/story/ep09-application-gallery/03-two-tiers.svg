<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Two backends, one netlist</title>
  <desc id="d">The same Yosys netlist runs in an oracle shape-laboratory tier with ordinary numbers and huge batches, or in an encrypted tier where wires carry lattice samples and every look-up table costs a blind rotation. Only the second is FHE.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(1000 152)" font-family="Arial,sans-serif">
    <rect x="205" width="420" height="62" rx="14" fill="#1b2637" stroke="#66758a" stroke-width="2"/>
    <text x="415" y="26" text-anchor="middle" fill="#9aa8b8" font-size="14" letter-spacing="2">ONE YOSYS NETLIST</text>
    <text x="415" y="50" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">same wires · same answers</text>

    <path d="M415 62v26M180 88h470M180 88v24M650 88v24" fill="none" stroke="#66758a" stroke-width="3"/>

    <g transform="translate(0 112)">
      <rect width="360" height="196" rx="18" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="180" y="30" text-anchor="middle" fill="#22a89c" font-size="14" letter-spacing="2">ORACLE TIER</text>
      <text x="180" y="58" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">shape laboratory</text>
      <text x="20" y="94" fill="#9aa8b8" font-size="17">· ordinary numbers</text>
      <text x="20" y="122" fill="#9aa8b8" font-size="17">· enormous batch</text>
      <text x="20" y="150" fill="#9aa8b8" font-size="17">· real time</text>
      <text x="180" y="180" text-anchor="middle" fill="#22a89c" font-size="17">proves the shape</text>
    </g>

    <g transform="translate(470 112)">
      <rect width="360" height="196" rx="18" fill="#282235" stroke="#d4833f" stroke-width="2"/>
      <text x="180" y="30" text-anchor="middle" fill="#d4833f" font-size="14" letter-spacing="2">ENCRYPTED TIER</text>
      <text x="180" y="58" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">torus FHE</text>
      <text x="20" y="94" fill="#9aa8b8" font-size="17">· lattice samples</text>
      <text x="20" y="122" fill="#9aa8b8" font-size="17">· blind rotation per table</text>
      <text x="20" y="150" fill="#9aa8b8" font-size="17">· seconds per row</text>
      <text x="180" y="180" text-anchor="middle" fill="#d4833f" font-size="17">carries the FHE claim</text>
    </g>

    <rect x="0" y="336" width="830" height="70" rx="16" fill="#33161b" stroke="#e0574c" stroke-width="2"/>
    <text x="415" y="364" text-anchor="middle" fill="#e0574c" font-size="14" letter-spacing="2">THE COMMON ERROR</text>
    <text x="415" y="391" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">calling the oracle tier “encrypted computing”</text>

    <text x="415" y="452" text-anchor="middle" fill="#9aa8b8" font-size="19">Same circuit. Different claim. Always name the tier.</text>
  </g>
</svg>
