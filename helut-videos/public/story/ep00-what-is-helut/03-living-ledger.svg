<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The living claim ledger</title>
  <desc id="d">Claims move through measured, re-measured, corrected, withdrawn, and recovered states. Every public claim carries a date because the ledger is expected to change.</desc>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#16323d"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#lg)"/>
  <g transform="translate(1010 160)" font-family="Arial,sans-serif">
    <rect x="40" width="760" height="86" rx="18" fill="#14283a" stroke="#22a89c" stroke-width="2"/>
    <text x="420" y="35" text-anchor="middle" fill="#22a89c" font-size="16" letter-spacing="3">LIVING LEDGER</text>
    <text x="420" y="68" text-anchor="middle" fill="#f4f6f8" font-size="26" font-weight="700">Every claim carries a date</text>

    <path d="M420 86v40" stroke="#22a89c" stroke-width="3"/>

    <g transform="translate(0 126)">
      <rect width="360" height="74" rx="14" fill="#122b35" stroke="#22a89c"/>
      <text x="180" y="30" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">MEASURED</text>
      <text x="180" y="57" text-anchor="middle" fill="#fff" font-size="21">receipt + log</text>
    </g>
    <g transform="translate(440 126)">
      <rect width="360" height="74" rx="14" fill="#122b35" stroke="#22a89c"/>
      <text x="180" y="30" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">RE-MEASURED</text>
      <text x="180" y="57" text-anchor="middle" fill="#fff" font-size="21">median of runs</text>
    </g>

    <path d="M180 200v34M620 200v34M180 234h620" fill="none" stroke="#66758a" stroke-width="3"/>
    <path d="M180 234v30M420 234v30M620 234v30" stroke="#66758a" stroke-width="3"/>

    <g transform="translate(0 264)">
      <rect width="230" height="78" rx="14" fill="#282235" stroke="#d4833f"/>
      <text x="115" y="30" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="1">CORRECTED</text>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="19">bound restated</text>
    </g>
    <g transform="translate(285 264)">
      <rect width="230" height="78" rx="14" fill="#2c2024" stroke="#d4833f"/>
      <text x="115" y="30" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="1">WITHDRAWN</text>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="19">stays visible</text>
    </g>
    <g transform="translate(570 264)">
      <rect width="230" height="78" rx="14" fill="#122b35" stroke="#22a89c"/>
      <text x="115" y="30" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="1">RECOVERED</text>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="19">better route</text>
    </g>

    <rect x="40" y="384" width="760" height="70" rx="16" fill="#101a2b" stroke="#66758a"/>
    <text x="420" y="412" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="2">THE SEARCH</text>
    <text x="420" y="440" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">new levers · new applications · better evidence</text>

    <text x="420" y="500" text-anchor="middle" fill="#d4833f" font-size="20">Deliberately unfinished. Corrected in public.</text>
  </g>
</svg>
