<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">HELUT evidence boundaries</title><desc id="d">Implementation, bounded receipt, and unsupported global claims are separated into three cards.</desc><rect width="1920" height="1080" fill="#091321"/><g transform="translate(1030 225)" font-family="Arial,sans-serif"><g><rect width="250" height="430" rx="28" fill="#132638" stroke="#22a89c" stroke-width="2"/><circle cx="125" cy="125" r="52" fill="none" stroke="#22a89c" stroke-width="6"/><path d="M95 126l22 22 41-48" fill="none" stroke="#22a89c" stroke-width="8"/><text x="125" y="225" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">IMPLEMENTATION</text><text x="125" y="272" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">It runs</text><text x="125" y="320" text-anchor="middle" fill="#9aa8b8" font-size="18">compile · execute</text><text x="125" y="350" text-anchor="middle" fill="#9aa8b8" font-size="18">reproduce</text></g><path d="M265 215h55" stroke="#66758a" stroke-width="4"/><g transform="translate(335)"><rect width="250" height="430" rx="28" fill="#282235" stroke="#d4833f" stroke-width="2"/><rect x="73" y="73" width="104" height="104" rx="16" fill="none" stroke="#d4833f" stroke-width="5"/><path d="M95 105h60M95 130h60M95 155h38" stroke="#d4833f" stroke-width="5"/><text x="125" y="225" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">BOUNDED RECEIPT</text><text x="125" y="272" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Name the scope</text><text x="125" y="320" text-anchor="middle" fill="#9aa8b8" font-size="18">profile · inputs</text><text x="125" y="350" text-anchor="middle" fill="#9aa8b8" font-size="18">remaining limits</text></g><path d="M600 215h55" stroke="#66758a" stroke-width="4"/><g transform="translate(670)"><rect width="250" height="430" rx="28" fill="#321b23" stroke="#d4833f" stroke-width="2"/><path d="M82 82l86 86M168 82l-86 86" stroke="#d4833f" stroke-width="9"/><text x="125" y="225" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">NOT ESTABLISHED</text><text x="125" y="272" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Global claims</text><text x="125" y="320" text-anchor="middle" fill="#9aa8b8" font-size="18">unbreakable</text><text x="125" y="350" text-anchor="middle" fill="#9aa8b8" font-size="18">production-secure</text></g><rect x="110" y="490" width="700" height="90" rx="18" fill="#101a2b" stroke="#66758a"/><text x="460" y="528" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">The claim sheet moves when the evidence moves.</text><text x="460" y="559" text-anchor="middle" fill="#9aa8b8" font-size="18">A receipt supports its own scope—nothing larger.</text></g></svg>