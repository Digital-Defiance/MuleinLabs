<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Rotor eight on the fast wheel</title>
  <desc id="d">Three 1 May nets agree on rotor VIII fast. Allocation lists disagree on column 645.</desc>
  <defs>
    <radialGradient id="bg" cx="78%" cy="30%" r="75%">
      <stop offset="0" stop-color="#173f4a"/>
      <stop offset="0.55" stop-color="#101c31"/>
      <stop offset="1" stop-color="#08111f"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g transform="translate(1040 150)"><rect width="760" height="166" rx="16" fill="#122b35" stroke="#22a89c" stroke-width="2"/><text x="28" y="28" fill="#22a89c" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">1 MAY DAILY KEYS</text><text x="28" y="64" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">Potsdam  IV · III · VIII</text><text x="28" y="96" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">Second   V · VI · VIII</text><text x="28" y="128" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">Third    V · II · VIII</text></g>
  <g transform="translate(1040 334)"><rect width="760" height="132" rx="16" fill="#2b2116" stroke="#d4833f" stroke-width="2"/><text x="28" y="28" fill="#d4833f" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">IF THEY CHOSE FREELY</text><text x="28" y="64" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">About 1.6 percent</text><text x="28" y="96" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">42 of 336 orders, not a close</text></g>
  <g transform="translate(1040 484)"><rect width="760" height="132" rx="16" fill="#33161b" stroke="#e0574c" stroke-width="2"/><text x="28" y="28" fill="#e0574c" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">HER LISTS</text><text x="28" y="64" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">Forelle: column 645 Aegir</text><text x="28" y="96" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="26">Later list: column 645 Thetis</text></g>
</svg>
