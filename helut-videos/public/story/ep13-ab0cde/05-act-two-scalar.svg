<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Act two repeats twenty-two source windows through ten thousand scalar clear evaluations</title>
  <desc id="d">The payload yields twenty-two unique six-byte windows. Four hundred fifty-four complete cycles produce nine hundred eight matches; twelve remainder windows add none. This is not native tensor batching or encrypted throughput.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(986 118)" font-family="Arial,sans-serif">
    <text x="430" y="18" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="3">ACT II · CLEAR SCALAR HOST LOOP</text>
    <g transform="translate(12 58)">
      <g>
        <rect width="836" height="108" rx="17" fill="#142738" stroke="#22a89c"/>
        <text x="28" y="40" fill="#9aa8b8" font-size="15" letter-spacing="2">OVERLAPPING WINDOWS</text>
        <text x="28" y="78" fill="#fff" font-size="30" font-weight="700">27 − 6 + 1 = <tspan fill="#22a89c">22 unique windows</tspan></text>
      </g>
      <g transform="translate(0 136)">
        <rect width="836" height="238" rx="18" fill="#0c1724" stroke="#66758a"/>
        <text x="28" y="39" fill="#9aa8b8" font-size="14" letter-spacing="2">TEN THOUSAND CALLS, WINDOW BY WINDOW</text>
        <text x="28" y="87" fill="#fff" font-size="28" font-weight="700">10,000 = 454 × 22 + 12</text>
        <path d="M40 122H796" stroke="#66758a" stroke-width="2"/>
        <text x="28" y="158" fill="#fff" font-size="22">454 complete cycles × 2 callsigns</text>
        <text x="608" y="158" fill="#22a89c" font-size="25" font-weight="700">908</text>
        <text x="28" y="196" fill="#fff" font-size="22">first 12 remainder windows</text>
        <text x="608" y="196" fill="#9aa8b8" font-size="25" font-weight="700">+ 0</text>
      </g>
      <g transform="translate(0 404)">
        <rect width="836" height="112" rx="17" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
        <text x="28" y="40" fill="#22a89c" font-size="14" letter-spacing="2">FILMED VERDICT</text>
        <text x="28" y="78" fill="#fff" font-size="31" font-weight="700">908 / 908 · PASS</text>
        <text x="520" y="78" fill="#9aa8b8" font-size="17">113.34 ms observation</text>
      </g>
      <rect y="544" width="836" height="82" rx="14" fill="#2b2025" stroke="#d4833f"/>
      <text x="418" y="577" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">ONE SCALAR CALL AT A TIME</text>
      <text x="418" y="607" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">not native tensor batch · not encrypted throughput</text>
    </g>
  </g>
</svg>
