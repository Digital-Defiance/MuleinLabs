<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">The Episode 13 receipt is separated from claims it does not support</title>
  <desc id="d">Measured local recovery, fixed-literal matching, clear scalar repetition, and one N=8 demonstration window are separated from OTA, noise tolerance, regex, native batching, encrypted-stream, and production-security claims.</desc>
  <rect width="1920" height="1080" fill="#091522"/>
  <g transform="translate(974 122)" font-family="Arial,sans-serif">
    <text x="442" y="18" text-anchor="middle" fill="#9aa8b8" font-size="15" letter-spacing="3">THE BOUNDARY AROUND THE RUN</text>
    <g transform="translate(0 56)">
      <rect width="430" height="590" rx="19" fill="#122b35" stroke="#22a89c" stroke-width="2"/>
      <text x="215" y="42" text-anchor="middle" fill="#22a89c" font-size="15" letter-spacing="2">IN THE RECEIPT</text>
      <g transform="translate(24 76)">
        <rect width="382" height="82" rx="12" fill="#142738"/><text x="18" y="32" fill="#fff" font-size="19" font-weight="700">Local loop · 27 / 27 exact</text><text x="18" y="59" fill="#9aa8b8" font-size="15">noise_voltage=0.0 · no antenna</text>
        <rect y="98" width="382" height="82" rx="12" fill="#142738"/><text x="18" y="130" fill="#fff" font-size="19" font-weight="700">Fixed AB0CDE circuit</text><text x="18" y="157" fill="#9aa8b8" font-size="15">48 inputs · 47 LUT2 · hits [17,24]</text>
        <rect y="196" width="382" height="82" rx="12" fill="#142738"/><text x="18" y="228" fill="#fff" font-size="19" font-weight="700">Clear scalar repetition</text><text x="18" y="255" fill="#9aa8b8" font-size="15">10,000 calls · 908 / 908</text>
        <rect y="294" width="382" height="82" rx="12" fill="#142738"/><text x="18" y="326" fill="#fff" font-size="19" font-weight="700">One encrypted window</text><text x="18" y="353" fill="#9aa8b8" font-size="15">N=8 demo · result 1</text>
        <rect y="392" width="382" height="82" rx="12" fill="#142738"/><text x="18" y="424" fill="#fff" font-size="19" font-weight="700">Literal, hashed evidence</text><text x="18" y="451" fill="#9aa8b8" font-size="15">tape · MP4 · complete raw log</text>
      </g>
    </g>
    <g transform="translate(454 56)">
      <rect width="430" height="590" rx="19" fill="#2b2025" stroke="#d4833f" stroke-width="2"/>
      <text x="215" y="42" text-anchor="middle" fill="#d4833f" font-size="15" letter-spacing="2">OUTSIDE THE RECEIPT</text>
      <g transform="translate(24 76)">
        <rect width="382" height="82" rx="12" fill="#201a22"/><text x="18" y="32" fill="#fff" font-size="19" font-weight="700">No OTA or interception</text><text x="18" y="59" fill="#9aa8b8" font-size="15">finite local vector source only</text>
        <rect y="98" width="382" height="82" rx="12" fill="#201a22"/><text x="18" y="130" fill="#fff" font-size="19" font-weight="700">No noise-tolerance result</text><text x="18" y="157" fill="#9aa8b8" font-size="15">zero injected AWGN in the film</text>
        <rect y="196" width="382" height="82" rx="12" fill="#201a22"/><text x="18" y="228" fill="#fff" font-size="19" font-weight="700">No general regex engine</text><text x="18" y="255" fill="#9aa8b8" font-size="15">one exact case-sensitive literal</text>
        <rect y="294" width="382" height="82" rx="12" fill="#201a22"/><text x="18" y="326" fill="#fff" font-size="19" font-weight="700">No native tensor batch</text><text x="18" y="353" fill="#9aa8b8" font-size="15">scalar clear host loop</text>
        <rect y="392" width="382" height="82" rx="12" fill="#201a22"/><text x="18" y="424" fill="#fff" font-size="19" font-weight="700">No encrypted stream</text><text x="18" y="451" fill="#9aa8b8" font-size="15">one N=8 window · not production</text>
      </g>
    </g>
  </g>
</svg>
