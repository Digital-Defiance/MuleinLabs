<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Bounded TensorLUT bridge</title><desc id="d">One observed LUT and a two-LUT cascade are bounded demonstrated regions; an arbitrary netlist remains outside scope.</desc><rect width="1920" height="1080" fill="#0a1321"/><g transform="translate(930 225)" font-family="Arial,sans-serif"><g><rect width="280" height="365" rx="28" fill="#142738" stroke="#22a89c" stroke-width="3"/><text x="140" y="50" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">C44 · BOUNDED</text><rect x="73" y="100" width="134" height="96" rx="16" fill="#101a2b" stroke="#22a89c" stroke-width="3"/><text x="140" y="158" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">1 LUT</text><text x="140" y="245" text-anchor="middle" fill="#fff" font-size="22">fully observed</text><text x="140" y="280" text-anchor="middle" fill="#9aa8b8" font-size="18">inside snap basin</text><text x="140" y="320" text-anchor="middle" fill="#22a89c" font-size="18">target recovered</text></g><g transform="translate(315)"><rect width="310" height="365" rx="28" fill="#282235" stroke="#d4833f" stroke-width="3"/><text x="155" y="50" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">C48 · DEMONSTRATED</text><rect x="45" y="110" width="92" height="72" rx="14" fill="#101a2b" stroke="#d4833f"/><text x="91" y="154" text-anchor="middle" fill="#fff" font-size="19">AND</text><path d="M137 146h36" stroke="#d4833f" stroke-width="4"/><rect x="173" y="110" width="92" height="72" rx="14" fill="#101a2b" stroke="#d4833f"/><text x="219" y="154" text-anchor="middle" fill="#fff" font-size="19">XOR</text><text x="155" y="245" text-anchor="middle" fill="#fff" font-size="22">all 8 inputs</text><text x="155" y="280" text-anchor="middle" fill="#9aa8b8" font-size="18">Verilog emitted</text><text x="155" y="320" text-anchor="middle" fill="#d4833f" font-size="18">equivalent dual allowed</text></g><g transform="translate(660)"><rect width="310" height="365" rx="28" fill="#171c29" stroke="#66758a" stroke-width="2" stroke-dasharray="10 10"/><text x="155" y="50" text-anchor="middle" fill="#9aa8b8" font-size="17" letter-spacing="2">OUTSIDE SCOPE</text><g transform="translate(60 105)" fill="#101a2b" stroke="#66758a"><rect width="82" height="62" rx="10"/><rect x="112" width="82" height="62" rx="10"/><rect x="56" y="92" width="82" height="62" rx="10"/><path d="M82 62l15 30M153 62l-30 30M138 123h45" fill="none"/></g><text x="155" y="275" text-anchor="middle" fill="#fff" font-size="22">arbitrary netlist</text><text x="155" y="310" text-anchor="middle" fill="#9aa8b8" font-size="18">no completeness claim</text></g><rect x="120" y="430" width="735" height="90" rx="18" fill="#101a2b" stroke="#66758a"/><text x="487" y="468" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">A bounded bridge is useful because its edge is visible.</text><text x="487" y="499" text-anchor="middle" fill="#9aa8b8" font-size="18">It does not promise convergence for every circuit.</text></g></svg>