<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">TensorLUT melt-freeze-snap path</title><desc id="d">A binary truth table melts to continuous values, is scored and pushed toward binary, then emits discrete Verilog only after snapping cleanly.</desc><rect width="1920" height="1080" fill="#0a1321"/><g transform="translate(930 210)" font-family="Arial,sans-serif"><g transform="translate(15 40)"><text x="105" y="-15" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">FIXED INIT</text><g fill="#22a89c"><rect width="34" height="34" rx="5"/><rect x="44" width="34" height="34" rx="5" fill-opacity=".2"/><rect x="88" width="34" height="34" rx="5"/><rect x="132" width="34" height="34" rx="5" fill-opacity=".2"/><rect x="176" width="34" height="34" rx="5"/><rect y="44" width="34" height="34" rx="5" fill-opacity=".2"/><rect x="44" y="44" width="34" height="34" rx="5"/><rect x="88" y="44" width="34" height="34" rx="5" fill-opacity=".2"/><rect x="132" y="44" width="34" height="34" rx="5"/><rect x="176" y="44" width="34" height="34" rx="5" fill-opacity=".2"/></g><text x="105" y="116" text-anchor="middle" fill="#9aa8b8" font-size="18">64 binary entries</text></g><path d="M245 85h90" stroke="#d4833f" stroke-width="4"/><text x="290" y="68" text-anchor="middle" fill="#d4833f" font-size="16">MELT</text><g transform="translate(345)"><rect width="320" height="220" rx="26" fill="#282235" stroke="#d4833f" stroke-width="2"/><text x="160" y="48" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">CONTINUOUS SEARCH</text><path d="M40 150C85 55 130 190 175 90S260 160 285 62" fill="none" stroke="#d4833f" stroke-width="6"/><text x="160" y="194" text-anchor="middle" fill="#9aa8b8" font-size="18">multilinear evaluation</text></g><path d="M665 110h92" stroke="#22a89c" stroke-width="4"/><g transform="translate(767 32)"><rect width="190" height="155" rx="24" fill="#142738" stroke="#22a89c"/><text x="95" y="48" text-anchor="middle" fill="#22a89c" font-size="17" letter-spacing="2">SCORE</text><text x="95" y="91" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">error + λ</text><text x="95" y="124" text-anchor="middle" fill="#9aa8b8" font-size="17">push to 0 / 1</text></g><path d="M505 220v92" stroke="#d4833f" stroke-width="4"/><path d="M493 302l12 20 12-20" fill="#d4833f"/><g transform="translate(290 322)"><rect width="430" height="190" rx="28" fill="#2b2025" stroke="#d4833f" stroke-width="2"/><text x="215" y="48" text-anchor="middle" fill="#d4833f" font-size="17" letter-spacing="2">FREEZE + SNAP</text><text x="215" y="94" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">all entries binary?</text><g transform="translate(110 132)" fill="#22a89c"><circle r="16"/><circle cx="52" r="16" fill-opacity=".2"/><circle cx="104" r="16"/><circle cx="156" r="16" fill-opacity=".2"/><circle cx="208" r="16"/></g></g><path d="M720 417h82" stroke="#22a89c" stroke-width="4"/><g transform="translate(802 350)"><rect width="170" height="135" rx="22" fill="#142738" stroke="#22a89c"/><text x="85" y="43" text-anchor="middle" fill="#22a89c" font-size="17">EMIT</text><text x="85" y="81" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Verilog</text><text x="85" y="109" text-anchor="middle" fill="#9aa8b8" font-size="17">discrete only</text></g><text x="505" y="590" text-anchor="middle" fill="#9aa8b8" font-size="20">Search is continuous. The destination must still be discrete.</text></g></svg>